ın vahiy etrafındaki şüpheleri","b":[{"k":"h","x":"Kur'an, Hz. Peygamber'in sözüdür iddiası"},{"k":"sc","q":"1. şüphe: Kur'an'ın Hz. Peygamber'in sözü olduğunu sandılar.","x":"Bu batıldır. Gerekçeleri aşağıdadır."},{"k":"li","x":"Resûlullah kendisi için liderlik isteyip bunu pekiştirmek için mucizelerle meydan okumuş olsaydı, meydan okuduğu şeyi başkasına nispet etmesinde ona ne fayda vardı? Kur'an'ı kendisine nispet edip şerefini daha da artırırdı."},{"k":"li","x":"**İfk hadisesinde** Allah Resûlü çok güç durumda kaldı; bu durum ayet nazil oluncaya kadar sürdü. Kur'an kendi sözü olsaydı iftiracıların ağzını kapatan bir şey söylemez miydi?"},{"k":"li","x":"**Abdullah b. Ümmü Mektûm olayı** sebebiyle Abese suresinin ilk ayetlerinde Allah Resûlü'nün uyarılması, Kur'an'ın Allah kelamı olduğuna bir başka delildir."},{"k":"li","x":"Kur'an'da Peygamber'e **itap içeren ayetler** vardır. Biri yazdığı kitapta neden kendini azarlasın? Tebük'te münafıklara izin verme olayı ve Bedir'de esirlerin serbest bırakılışı:"},{"k":"ar","a":"عَفَا اللَّهُ عَنْكَ لِمَ أَذِنْتَ لَهُمْ حَتَّى يَتَبَيَّنَ لَكَ الَّذِينَ صَدَقُوا وَتَعْلَمَ الْكَاذِبِينَ","x":"Tevbe 9/43"},{"k":"ar","a":"مَا كَانَ لِنَبِيٍّ أَنْ يَكُونَ لَهُ أَسْرَى حَتَّى يُثْخِنَ فِي الْأَرْضِ تُرِيدُونَ عَرَضَ الدُّنْيَا وَاللَّهُ يُرِيدُ الْآخِرَةَ وَاللَّهُ عَزِيزٌ حَكِيمٌ","x":"Enfâl 8/67"},{"k":"li","x":"**Hz. Zeyneb'le evlilik meselesi:** \"İnsanlardan korkuyorsun; oysa Allah korkulmaya daha layıktır.\""},{"k":"h","x":"Kur'an \"vahy-i nefsî\" yoluyla ortaya çıkmıştır iddiası"},{"k":"sc","q":"2. şüphe: Kur'an vahy-i nefsî yoluyla ortaya çıkmıştır.","x":"Müşrikler, Hz. Peygamber'in keskin zekâ ve kuvvetli ferasetiyle hayrı ve şerri, hak ile batılı ilham yoluyla anlayıp gizli olayları keşifle bilerek Kur'an'ı oluşturduğunu iddia ettiler. Onlara göre Kur'an, Hz. Muhammed'in kendi üslubuyla ifade ettiği aklî istinbat ve vicdanî idrakin ürünüdür."},{"k":"li","x":"**Cevap:** Kur'an evrenin ilk yaratılışından itibaren geçmiş toplumların haberlerini aktarır. Allah Resûlü muhtelif asırlarda olan bu olayları zekâ, istinbat ve şuur yoluyla nasıl elde edebilir?"},{"k":"li","x":"Akaid, yaratılışın başlangıcı, ahiret hayatı, melekler ve vasıfları gibi konularda aklın keskinliğine ve ferasetin kuvvetine kesinlikle yer yoktur."},{"k":"h","x":"Hz. Peygamber Kur'an'ı bir muallimden öğrenmiştir iddiası"},{"k":"sc","q":"3. şüphe: Hz. Peygamber Kur'an'ı bir muallimden öğrenmiştir.","x":"Hz. Peygamber'in muallimi vahiy meleğidir. O ümmî bir toplumda doğmuş, büyümüş ve yaşamıştır."},{"k":"li","x":"Tarihî hakikatler onun bir bilgine sorular sorup bilgi aldığına dair herhangi bir bilgi aktarmaz."},{"k":"li","x":"**Rahip Bahîrâ** ve **Varaka b. Nevfel**'den nakledilen sözler, onun peygamberliği hakkında müjdeler ve itiraflardır."},{"k":"li","x":"Müşrikler, Kur'an'ı **Rum bir demirciden** öğrendiğini de iddia ettiler. Bu kişi Arap değil, acemdir; ondan öğrenmesi mümkün değildir. Demircide bu zekâ olsaydı demirci olarak kalmaz, kendisi uydurup meşhur olurdu."}]}],"ht":[{"s":0,"x":"Vahyin imkânı: hipnotizma ve iletişim araçları misali; vahye sarılanın izzeti; vahiy alan ilk peygamberin Hz. Muhammed olmaması."},{"s":1,"x":"Vahyin sözlük anlamları: fıtrî ilham (Mûsâ'nın annesi) · içgüdü (arı) · remz/işaret (Zekeriyyâ) · şeytanın vesvesesi · meleklere emir."},{"s":3,"x":"Kur'an'ın 4 özelliği: mucize · sübutu kat'î · tilavetiyle ibadet · lafzıyla eda vacip."},{"s":4,"x":"Hadîs-i nebevî: manası vahiy (mana ile rivayeti caiz) · içtihad (vahiy değil, vahyin sükûtuyla onaylanır)."},{"s":6,"x":"Üç şüphe: Kur'an Peygamber'in sözüdür · vahy-i nefsîdir · bir muallimden öğrenilmiştir."},{"s":6,"x":"Peygamber'in sözü olmadığının delilleri: başkasına nispet etmesi, İfk'te beklemesi, Abese, itap ayetleri (Tebük, Bedir esirleri), Hz. Zeyneb meselesi."}]},{"t":"Mekkî–Medenî Sûreler","intro":"Ulemanın Mekkî ve Medenî ilmine gösterdiği özen, bu ilmi bilmenin önemi, bilinme yolları, üç kriter ve Mekkî ile Medenî sûrelerin kaide ve nitelikleri.","s":[{"h":"Ulemanın bu konuya gösterdiği özen (inâyet)","b":[{"k":"ar","a":"قَالَ ابْنُ مَسْعُودٍ: وَاللَّهِ الَّذِي لَا إِلَهَ غَيْرُهُ مَا نَزَلَتْ سُورَةٌ مِنْ كِتَابِ اللَّهِ إِلَّا وَأَنَا أَعْلَمُ أَيْنَ نَزَلَتْ، وَلَا نَزَلَتْ آيَةٌ مِنْ كِتَابِ اللَّهِ إِلَّا وَأَنَا أَعْلَمُ فِيمَ نَزَلَتْ، وَلَوْ أَعْلَمُ أَنَّ أَحَدًا أَعْلَمُ مِنِّي بِكِتَابِ اللَّهِ تَبْلُغُهُ الْإِبِلُ لَرَكِبْتُ إِلَيْهِ","x":"İbn Mes'ûd: Allah'ın kitabından hiçbir sure yoktur ki nerede indiğini, hiçbir ayet yoktur ki ne hakkında indiğini bilmeyeyim. Benden daha iyi bileni olsaydı develerle ona giderdim."},{"k":"li","x":"Ebü'l-Kâsım en-Nîsâbûrî (et-Tenbîh alâ Fazli Ulûmi'l-Kur'ân): Kur'an ilimlerinin en şereflisi nüzulünü ve yönlerini bilmektir. Mekke ve Medine'de inenler, Mekke'de inip hükmü Medenî olanlar, Medine'de inip hükmü Mekkî olanlar, gece ve gündüz inenler, sefer ve hazarda inenler… **25 vecih** sayar ve bunları bilip ayırt etmeyen kimsenin Allah'ın kitabı hakkında konuşmasının helal olmadığını söyler."},{"k":"li","x":"Ulemanın bu konudaki inâyetini gösteren en önemli delil, ayetlerin indiği zamanları dikkate alıp konuyu ayrıntılı ele almalarıdır: **leylî–nehârî** (gece–gündüz), **sayfî–şitâî** (yaz–kış), **hadarî–seferî** (yerleşik–yolculuk)…"},{"k":"h","x":"Âlimlerin incelediği başlıca türler"},{"k":"tbl","r":[["Mekân ile ilgili","Zaman ve durum ile ilgili"],["Mekke'de inen","Gece inen ve gündüz inen"],["Medine'de inen","Yazın inen ve kışın inen"],["Hakkında ihtilaf edilen","Hazarda inen ve seferde inen"],["Medenî surelerdeki Mekkî ayetler","Medenî olanın Mekkî'ye benzeyeni"],["Mekkî surelerdeki Medenî ayetler","Mekkî olanın Medenî'ye benzeyeni"],["Mekke'de inip hükmü Medenî olan","Mekke'den Medine'ye taşınan"],["Medine'de inip hükmü Mekkî olan","Medine'den Mekke'ye taşınan"]]},{"k":"li","x":"Bu 14 tür esastır; hepsi Mekkî ve Medenî ekseninde döner. Bu yüzden ilme \"**ilmü'l-Mekkî ve'l-Medenî**\" denmiştir."}]},{"h":"Âyetlerin Mekkî ve Medenî olduğunu bilmenin önemi","b":[{"k":"n","n":1,"x":"**Kur'an tefsirinden yararlanılır:** İki ayette mana çeliştiğinde müfessir bunun ışığında nâsih ile mensuhu ayırt eder; ayetleri doğru anlar ve doğru tefsir eder."},{"k":"n","n":2,"x":"**Kur'an'ın üslubundan zevk almak ve Allah'a davette bu üsluptan faydalanmak:** Hitap insanların sınıflarına, inançlarına ve sosyal durumlarına göre değişir. Bu, davette hitap yolları için bir metot verir: önce imanî ilkeler, sonra ahkâm ayetleri."},{"k":"n","n":3,"x":"**Kur'anî ayetler içinden Sîret-i Nebî'ye vâkıf olmak:** Mekke ve Medine devrinde davet tarihinin izlerini Kur'an'la görebiliriz."}]},{"h":"Mekkî/Medenî olduğu nasıl bilinir? (Nakil ve kıyas)","b":[{"k":"li","x":"Ca'berî: «لِمَعْرِفَةِ الْمَكِّيِّ وَالْمَدَنِيِّ طَرِيقَانِ: سَمَاعِيٌّ وَقِيَاسِيٌّ» Semâî nakle, kıyâsî akla dayanır; nakil ve akıl, sağlam bilginin ve ilmî tahkikin iki yoludur."},{"k":"tbl","r":[["Yol","Dayanağı","Açıklama"],["**1. Rivayet (semâî)**","Sahabe ve tâbiînden sahih rivayet","Kur'an'ın çoğu bu yolla bilinir. Hz. Peygamber'den bu konuda bir söz gelmemiştir, çünkü bununla emrolunmamıştır (Kadı Ebû Bekir, el-İntisâr)."],["**2. Kıyas (kıyâsî)**","Mekkî ve Medenî'nin özellikleri","Üslup ve özelliğe dayalı bu yol içtihaddır."]]},{"k":"ornek","x":"Kıyas yoluna örnek: İçinde geçmiş peygamber ve ümmetlerin kıssaları bulunan her sure Mekkî; içinde farz veya had bulunan her sure Medenîdir."}]},{"h":"Mekkî ve Medenî kriteri (zaman, mekân, hitap)","b":[{"k":"li","x":"Bu konuda 3 görüş vardır:"},{"k":"tbl","r":[["Kriter","Mekkî","Medenî","Değerlendirme"],["**1. Zaman**","Hicretten önce inen (Mekke dışında inse bile)","Hicretten sonra inen (Mekke'de veya Arafat'ta inse bile)","**En uygun görüş:** kapsayıcı ve tutarlıdır (Hicretten önce ve sonra esas alınır; nerede indiğinin önemi yoktur)."],["**2. Mekân**","Mekke ve çevresinde (Mina, Arafat, Hudeybiye) inen","Medine ve çevresinde (Uhud, Kuba, Sel') inen","Hicretten sonra inse bile Mekke'de inen Mekkîdir."],["**3. Muhatap**","Mekke halkına hitap eden: «يَا أَيُّهَا النَّاسُ»","Medine halkına hitap eden: «يَا أَيُّهَا الَّذِينَ آمَنُوا»","Bu ölçü tutarlı değildir."]]},{"k":"ornek","x":"Zaman kriterine göre Veda Haccında (Mekke'de) inen ayet Medenîdir: «الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الْإِسْلَامَ دِينًا» (Mâide 5/3)"},{"k":"dikkat","x":"Muhatap kriteri her yerde geçmez: Kur'an surelerinin çoğu bu iki hitaptan biriyle başlamaz. Bakara Medenîdir ama içinde «يَا أَيُّهَا النَّاسُ اعْبُدُوا رَبَّكُمُ» vardır; Nisâ Medenîdir ve «يَا أَيُّهَا النَّاسُ» ile başlar; Hac Mekkîdir ama içinde «يَا أَيُّهَا الَّذِينَ آمَنُوا ارْكَعُوا وَاسْجُدُوا» vardır."},{"k":"h","x":"Sure sayıları"},{"k":"tbl","r":[["Medenî","Mekkî","İhtilaflı"],["20 sure","82 sure","12 sure"]]}]},{"h":"Mekkî sûrelerin kaide ve nitelikleri","b":[{"k":"h","x":"A. Kaideleri"},{"k":"n","n":1,"x":"Secde bulunan sureler."},{"k":"n","n":2,"x":"«كَلَّا» lafzı bulunan sureler."},{"k":"n","n":3,"x":"Bakara ve Âl-i İmrân hariç \"Ey insanlar\" hitabı bulunup \"Ey iman edenler\" hitabı bulunmayanlar."},{"k":"n","n":4,"x":"Geçmiş ümmet ve peygamberlerin haberleri bulunan sureler."},{"k":"n","n":5,"x":"Bakara hariç Hz. Âdem–İblis kıssasının anlatıldığı sureler."},{"k":"n","n":6,"x":"Hurûf-ı mukattaa ile başlayan sureler."},{"k":"h","x":"B. Nitelikleri (konu ve üslup açısından)"},{"k":"n","n":1,"x":"Tevhid, risalet, ahiret konuları."},{"k":"n","n":2,"x":"Genel ahlakî esasların konulması; kötü âdet ve suçların ifşası: şirk, yetim malı yemek, kızları diri diri gömmek…"},{"k":"n","n":3,"x":"Geçmiş ümmet ve peygamberlerin haberlerinin azarlama ve teselli olarak anlatılması."},{"k":"n","n":4,"x":"Yeminlerle başlayan, özlü ibare ve kuvvetli lafızlarla yapılan sarsıcı anlatımlar."},{"k":"n","n":5,"x":"Yüksek ifade gücü ve musikî bir ahenk."},{"k":"n","n":6,"x":"Somutlaştırma: kıyamet sahneleri, cehennemin hâlleri, cennetin durumu vb."}]},{"h":"Medenî sûrelerin kaide ve nitelikleri","b":[{"k":"h","x":"A. Kaideleri"},{"k":"n","n":1,"x":"Farz ve hadler bulunan sureler."},{"k":"n","n":2,"x":"Ankebût hariç münafıklardan bahsedilen sureler."},{"k":"n","n":3,"x":"Ehl-i kitap ile mücadele bulunan sureler."},{"k":"h","x":"B. Nitelikleri (konu ve üslup açısından)"},{"k":"n","n":1,"x":"İbadet, muamelat, had, aile nizamı, miras, cihad meselelerinin beyanı."},{"k":"n","n":2,"x":"Ehl-i kitaba hitap ve onları İslam'a davet; yaşadıkları batıl hayatın ifşası."},{"k":"n","n":3,"x":"Münafıkların ahlak ve gidişatlarının ifşası."},{"k":"n","n":4,"x":"Teşrîi anlatan, hedef ve amaçlarını açıklayan bir üslup içinde ayetlerin uzun olması."},{"k":"n","n":5,"x":"Üslubunda yumuşaklık ve sükûnet; fasılaları uzun ve nesir üzere."},{"k":"h","x":"Karşılaştırma"},{"k":"tbl","r":[["","Mekkî","Medenî"],["Kaideler","Secde, kellâ, \"ey insanlar\", geçmiş ümmetler, Âdem–İblis, hurûf-ı mukattaa","Farz ve hadler, münafıklar (Ankebût hariç), ehl-i kitapla mücadele"],["Konu","Tevhid, risalet, ahiret; genel ahlak; kıssalar","İbadet, muamelat, had, aile, miras, cihad; ehl-i kitap; münafıklar"],["Üslup","Yeminli, sarsıcı, özlü; musikî ahenk; somutlaştırma","Uzun ayetler, teşrî üslubu; yumuşak ve sakin, nesre yakın"],["Benzetme","Çağlayan bir nehir","Durgun bir nehir"]]}]},{"h":"Mekkî âyete örnek","b":[{"k":"h","x":"Mekkî ayete örnek"},{"k":"ar","a":"يَا أَيُّهَا الْمُدَّثِّرُ، قُمْ فَأَنْذِرْ، وَرَبَّكَ فَكَبِّرْ، وَثِيَابَكَ فَطَهِّرْ، وَالرُّجْزَ فَاهْجُرْ، وَلَا تَمْنُنْ تَسْتَكْثِرُ، وَلِرَبِّكَ فَاصْبِرْ","x":"Müddessir 74/1–7 · kısa ayetler, tevhid ve davet"},{"k":"h","x":"Medenî ayete örnek"},{"k":"ar","a":"يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا قُمْتُمْ إِلَى الصَّلَاةِ فَاغْسِلُوا وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ وَامْسَحُوا بِرُءُوسِكُمْ وَأَرْجُلَكُمْ إِلَى الْكَعْبَيْنِ","x":"Mâide 5/6 · \"Ey iman edenler\" hitabı, uzun ayet, ibadet hükmü"}]}],"ht":[{"s":0,"x":"İbn Mes'ûd her surenin nerede, her ayetin ne hakkında indiğini bildiğini söyler."},{"s":0,"x":"Ulemanın inâyetinin delili: leylî–nehârî, sayfî–şitâî, hadarî–seferî ayrımları."},{"s":1,"x":"Mekkî–Medenî bilmenin 3 faydası: nâsih-mensûhu ayırmak · davet üslubu (önce iman, sonra ahkâm) · siyeri Kur'an'dan izlemek."},{"s":2,"x":"Bilme yolları: rivayet (sahabe ve tâbiîn; çoğu bu yolla) ve kıyas (özelliklere dayalı içtihad)."},{"s":3,"x":"En uygun kriter zamandır: hicretten önce Mekkî, sonra Medenî."},{"s":3,"x":"20 sure Medenî, 82 sure Mekkî, 12 sure ihtilaflı."},{"s":4,"x":"Mekkî kaideler: secde · kellâ · \"ey insanlar\" (Bakara, Âl-i İmrân hariç) · geçmiş ümmet haberleri · Âdem–İblis (Bakara hariç) · hurûf-ı mukattaa."},{"s":5,"x":"Medenî kaideler: farz ve hadler · münafıklar (Ankebût hariç) · ehl-i kitapla mücadele."},{"s":5,"x":"Mekkî sureler çağlayan, Medenî sureler durgun bir nehir gibidir."}]},{"t":"İlk ve Son Nâzil Olan Âyetler","intro":"İlk ve son inen ayetleri bilmenin yararları, bu konudaki görüşler, konu bakımından ilk inenler ve Mâide 3. ayetle ilgili meşhur bir hata.","s":[{"h":"İlk ve son inen âyetleri bilmenin yararları","b":[{"k":"n","n":1,"x":"**Nâsih-mensûh ayrımı:** Sonraki nâsih, önceki mensuhtur."},{"k":"n","n":2,"x":"**Kur'an'ın insanı eğitme metodunun öğrenilmesi:** Kur'an hangi konulara öncelik vermiş?"},{"k":"n","n":3,"x":"**Kur'an'ın titizlikle korunduğunun gösterilmesi:** Sahabenin Kur'an'a ilgisi."}]},{"h":"İlk inen âyetler: Alak, Müddessir, Fâtiha, Besmele","b":[{"k":"tbl","r":[["Görüş","Delil","Değerlendirme"],["**1. Alak suresinin ilk beş ayeti** «اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ»","Buhârî ve Müslim'deki Hz. Âişe hadisi: Melek üç defa \"oku\" der, Hz. Peygamber «مَا أَنَا بِقَارِئٍ» der.","**En sahih görüş.** Selef ve haleften âlimlerin cumhuru bu görüştedir."],["**2. Müddessir suresinin başları** «يَا أَيُّهَا الْمُدَّثِّرُ»","Buhârî ve Müslim'deki Câbir rivayeti","Fetretü'l-vahiyden sonra inen ilk ayettir."],["**3. Fâtiha** «إِنَّ أَوَّلَ مَا نَزَلَ سُورَةُ الْفَاتِحَةِ»","Ebû Meysere rivayeti","Zemahşerî Keşşâf'ta âlimlerin çoğunun bu görüşte olduğunu söyler; İbn Hacer bunun azınlığın görüşü olduğunu söyleyerek Zemahşerî'yi reddeder. Kadı Ebû Bekir (el-İntisâr): bu haber munkatıdır."],["**4. Besmele**","","Süyûtî: Her sure zaten besmeleyle başlar; bu müstakil bir görüş sayılmaz."]]},{"k":"h","x":"Müddessir görüşünün delili"},{"k":"ar","a":"عَنْ أَبِي سَلَمَةَ بْنِ عَبْدِ الرَّحْمَنِ قَالَ: سَأَلْتُ جَابِرَ بْنَ عَبْدِ اللَّهِ: أَيُّ الْقُرْآنِ أُنْزِلَ قَبْلُ؟ قَالَ: يَا أَيُّهَا الْمُدَّثِّرُ. فَقُلْتُ: أَوِ اقْرَأْ؟ فَقَالَ جَابِرٌ: أُحَدِّثُكُمْ مَا حَدَّثَنَا رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: جَاوَرْتُ بِحِرَاءٍ شَهْرًا، فَلَمَّا قَضَيْتُ جِوَارِي نَزَلْتُ فَاسْتَبْطَنْتُ بَطْنَ الْوَادِي، فَنُودِيتُ، فَإِذَا هُوَ جِبْرِيلُ، فَأَخَذَتْنِي رَجْفَةٌ، فَأَتَيْتُ خَدِيجَةَ فَأَمَرْتُهُمْ فَدَثَّرُونِي، فَأَنْزَلَ اللَّهُ: يَا أَيُّهَا الْمُدَّثِّرُ قُمْ فَأَنْذِرْ","x":"Hira'da bir ay kaldıktan sonra vadide Cebrâil'i görüp titreyen Hz. Peygamber \"beni örtün\" der; Müddessir'in başı iner."},{"k":"h","x":"Cevap"},{"k":"li","x":"Bu, **fetretü'l-vahiyden sonra** nazil olan ilk ayettir. Hadisin farklı varyantlarında geçen «فَإِذَا الْمَلَكُ الَّذِي جَاءَنِي بِحِرَاءٍ» ifadesi de bunu gösterir: Hira'da gelen melek daha önce gelmiştir."},{"k":"ar","a":"أَنَّ يَا أَيُّهَا الْمُدَّثِّرُ أَوَّلُ مَا نَزَلَ بَعْدَ فَتْرَةِ الْوَحْيِ، أَمَّا اقْرَأْ فَهِيَ أَوَّلُ مَا نَزَلَ عَلَى الْإِطْلَاقِ","x":"Müddessir fetretten sonra ilk inendir; İkra' ise mutlak olarak ilk inendir."},{"k":"not","x":"Fâtiha görüşü için: **bütün hâlinde inen ilk sure** kastedilmiş olabilir."}]},{"h":"Son inen âyetler: Bakara 281, ribâ âyeti, müdâyene âyeti, Nisâ 93, Âl-i İmrân 195…","b":[{"k":"tbl","r":[["#","Ayet","Değerlendirme"],["1","**Bakara 2/281** «وَاتَّقُوا يَوْمًا تُرْجَعُونَ فِيهِ إِلَى اللَّهِ»","**En sahih görüş.** Nesâî ve İbn Cerîr, İkrime kanalıyla İbn Abbas'tan; İbn Ebî Hâtim, Saîd b. Cübeyr'den."],["2","**Ribâ ayeti** (Bakara 2/278) «يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَذَرُوا مَا بَقِيَ مِنَ الرِّبَا»","İbn Abbas rivayeti. Ya ribâ hakkında inen son ayettir ya da mutlak son değil, son inen ayetler grubundandır."],["3","**Müdâyene ayeti** (Bakara 2/282) «إِذَا تَدَايَنْتُمْ بِدَيْنٍ إِلَى أَجَلٍ مُسَمًّى فَاكْتُبُوهُ»","**Muamelat** hakkında inen son ayettir."],["4","**Kelâle ayeti** (Nisâ 4/176) «يَسْتَفْتُونَكَ قُلِ اللَّهُ يُفْتِيكُمْ فِي الْكَلَالَةِ»","**Miras** hakkında inen son ayettir."],["5","**Nisâ 4/93** «وَمَنْ يَقْتُلْ مُؤْمِنًا مُتَعَمِّدًا فَجَزَاؤُهُ جَهَنَّمُ»","**Kasten mümini öldürmek** hakkında inen son ayettir."],["6","**Nasr suresi**","**Bütün hâlinde** inen son sure (Veda Haccında) veya Hz. Peygamber'in vefatını ihsas eden son ayetlerdendir."],["7","**Âl-i İmrân 3/195** «فَاسْتَجَابَ لَهُمْ رَبُّهُمْ أَنِّي لَا أُضِيعُ عَمَلَ عَامِلٍ مِنْكُمْ مِنْ ذَكَرٍ أَوْ أُنْثَى»","Ümmü Seleme rivayeti. **Kadınların zikredildiği üç ayetin sonuncusudur.**"]]},{"k":"not","x":"Diğer görüşlerin hepsi şu şekilde cevaplanır: O ayet **kendi konusunda** inen son ayettir (ribâ, muamelat, miras, kasten öldürme, kadınlar…)."},{"k":"h","x":"Âl-i İmrân 195'in arka planı"},{"k":"li","x":"Ümmü Seleme: \"Ey Allah'ın Resulü, Allah'ın erkekleri zikredip kadınları zikretmediğini görüyorum\" dedi. Bunun üzerine sırasıyla şu ayetler indi:"},{"k":"steps","x":["«وَلَا تَتَمَنَّوْا مَا فَضَّلَ اللَّهُ بِهِ بَعْضَكُمْ عَلَى بَعْضٍ» (Nisâ 4/32)","«إِنَّ الْمُسْلِمِينَ وَالْمُسْلِمَاتِ» (Ahzâb 33/35)","«فَاسْتَجَابَ لَهُمْ رَبُّهُمْ» (Âl-i İmrân 3/195): üçünün sonuncusu"]}]},{"h":"Konu bakımından ilk inenler: yiyecekler, içecekler (içki)…","b":[{"k":"li","x":"Arapçada «أَوَائِلُ مَوْضُوعِيَّةٌ» denir."},{"k":"h","x":"1. Yiyecekler hakkında ilk inen ayetler"},{"k":"steps","x":["**En'âm 6/145** (Mekke'de): «قُلْ لَا أَجِدُ فِي مَا أُوحِيَ إِلَيَّ مُحَرَّمًا عَلَى طَاعِمٍ يَطْعَمُهُ إِلَّا أَنْ يَكُونَ مَيْتَةً أَوْ دَمًا مَسْفُوحًا أَوْ لَحْمَ خِنْزِيرٍ»","**Nahl 16/114–115:** «فَكُلُوا مِمَّا رَزَقَكُمُ اللَّهُ حَلَالًا طَيِّبًا… إِنَّمَا حَرَّمَ عَلَيْكُمُ الْمَيْتَةَ وَالدَّمَ وَلَحْمَ الْخِنْزِيرِ»","**Bakara 2/173:** «إِنَّمَا حَرَّمَ عَلَيْكُمُ الْمَيْتَةَ وَالدَّمَ وَلَحْمَ الْخِنْزِيرِ وَمَا أُهِلَّ بِهِ لِغَيْرِ اللَّهِ»","**Mâide 5/3:** «حُرِّمَتْ عَلَيْكُمُ الْمَيْتَةُ وَالدَّمُ وَلَحْمُ الْخِنْزِيرِ… وَالْمُنْخَنِقَةُ وَالْمَوْقُوذَةُ وَالْمُتَرَدِّيَةُ وَالنَّطِيحَةُ»"]},{"k":"h","x":"2. İçecekler (içki) hakkında ilk inen ayetler"},{"k":"steps","x":["**Bakara 2/219:** «يَسْأَلُونَكَ عَنِ الْخَمْرِ وَالْمَيْسِرِ قُلْ فِيهِمَا إِثْمٌ كَبِيرٌ وَمَنَافِعُ لِلنَّاسِ وَإِثْمُهُمَا أَكْبَرُ مِنْ نَفْعِهِمَا»","**Nisâ 4/43:** «يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَقْرَبُوا الصَّلَاةَ وَأَنْتُمْ سُكَارَى حَتَّى تَعْلَمُوا مَا تَقُولُونَ»","**Mâide 5/90:** «يَا أَيُّهَا الَّذِينَ آمَنُوا إِنَّمَا الْخَمْرُ وَالْمَيْسِرُ وَالْأَنْصَابُ وَالْأَزْلَامُ رِجْسٌ مِنْ عَمَلِ الشَّيْطَانِ فَاجْتَنِبُوهُ لَعَلَّكُمْ تُفْلِحُونَ»"]},{"k":"ornek","x":"İbn Ömer: İçki hakkında üç ayet indi. Bakara 219 inince \"içki haram kılındı\" denildi; \"Ey Allah'ın Resulü, Allah'ın dediği gibi ondan faydalanalım\" dediler, sustu. Sonra Nisâ 43 indi; \"içki haram kılındı\" denildi; \"Namaza yakınken içmeyiz\" dediler, sustu. Sonra Mâide 90 indi; Resûlullah \"İçki haram kılındı\" buyurdu."},{"k":"h","x":"3. Savaş hakkında ilk inen ayet"},{"k":"ar","a":"أُذِنَ لِلَّذِينَ يُقَاتَلُونَ بِأَنَّهُمْ ظُلِمُوا وَإِنَّ اللَّهَ عَلَى نَصْرِهِمْ لَقَدِيرٌ","x":"Hac 22/39 · İbn Abbas'a göre savaş hakkında inen ilk ayet."}]},{"h":"Meşhur bir hataya dikkat çekme","b":[{"k":"li","x":"Arapçada «التَّنْبِيهُ إِلَى خَطَإٍ مَشْهُورٍ» başlığıyla geçer."},{"k":"dikkat","x":"**Yaygın hata:** Halk arasında ve bazı havas arasında «الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الْإِسْلَامَ دِينًا» (Mâide 5/3) ayetinin **Kur'an'dan en son inen ayet** olduğu sanılır. Ayet Veda Haccında, Arafe günü ve bir cuma günü indi; dinin kemale ermesinin ancak Kur'an'ın inişinin tamamlanmasıyla olacağı düşünülmüştür."},{"k":"li","x":"**Doğrusu:** Bu iddia sahih değildir. Âlimlerden hiç kimse bunun en son inen ayet olduğunu söylememiştir. Süyûtî son inen hakkındaki bütün görüşleri sıralamış, kimseden böyle bir söz nakletmemiştir."},{"k":"li","x":"**Ebû Şühbe:** Ribâ ayeti, kelâle ayeti ve Bakara 281. ayet Mâide 3. ayetten **sonra** nazil olmuştur. Bu ahkâm inmeden din nasıl kemale erecek?"}]}],"ht":[{"s":0,"x":"İlk ve son inenleri bilmenin 3 yararı: nâsih-mensûh · eğitim metodu · Kur'an'ın titizlikle korunması."},{"s":1,"x":"İlk inen: en sahih görüşe göre Alak 1–5 (Hz. Âişe hadisi, «مَا أَنَا بِقَارِئٍ»)."},{"s":1,"x":"Müddessir, fetretü'l-vahiyden sonra inen ilk ayettir. Fâtiha bütün hâlinde inen ilk sure olabilir. Besmele müstakil görüş sayılmaz (Süyûtî)."},{"s":2,"x":"Son inen: en sahih görüşe göre Bakara 281."},{"s":2,"x":"Diğerleri kendi konusunun son ayetidir: ribâ (Bakara 278), muamelat (müdâyene, Bakara 282), miras (kelâle, Nisâ 176), kasten öldürme (Nisâ 93), kadınlar (Âl-i İmrân 195). Nasr: bütün hâlinde inen son sure."},{"s":3,"x":"Yiyecekler: En'âm 145 → Nahl 114–115 → Bakara 173 → Mâide 3."},{"s":3,"x":"İçki: Bakara 219 → Nisâ 43 → Mâide 90. Savaş: Hac 39."},{"s":4,"x":"Mâide 3 (\"bugün dininizi kemale erdirdim\") en son inen ayet değildir; ribâ, kelâle ve Bakara 281 ondan sonra inmiştir."}]},{"t":"Esbâb-ı Nüzûl","intro":"Ayetlerin iniş sebeplerini bilmenin esasları, tanımı ve şekilleri, faydaları, \"umum-husus\" kaidesi, rivayetlerde kullanılan tabirler ve aynı ayet için birden fazla sebep bulunduğunda izlenecek yol.","s":[{"h":"Ulemanın bu ilme önem vermesi","b":[{"k":"li","x":"Nüzul sebebini bilmek ayeti doğru anlamayı kolaylaştırır. Ulema sebeb-i nüzule önem vermiş ve bu alanda müstakil kitaplar telif etmiştir."},{"k":"h","x":"Konuyla ilgili önemli eserler"},{"k":"tbl","r":[["Müellif","Vefat","Eser","Not"],["Vâhidî","468","Esbâbü'n-Nüzûl","Ca'berî (ö. 732) isnadlarını hazfederek aynı isimle ihtisar etmiştir."],["İbn Teymiyye","728","et-Tibyân fî Nüzûli'l-Kur'ân",""],["Süyûtî","911","Lübâbü'n-Nükûl fî Esbâbi'n-Nüzûl",""]]}]},{"h":"Sebeb-i nüzûlü bilmede dayanılan esaslar","b":[{"k":"li","x":"Âlimler nüzul sebebini bilmede Resûlullah'tan veya sahabeden gelen **sahih rivayete** dayanırlar. Çünkü sahabenin bu gibi şeylerden haber vermesi, sarih olursa rey ile olmaz; **merfû hadis hükmündedir**."},{"k":"ar","a":"قَالَ الْوَاحِدِيُّ: لَا يَحِلُّ الْقَوْلُ فِي أَسْبَابِ نُزُولِ الْكِتَابِ إِلَّا بِالرِّوَايَةِ وَالسَّمَاعِ مِمَّنْ شَاهَدُوا التَّنْزِيلَ، وَوَقَفُوا عَلَى الْأَسْبَابِ، وَبَحَثُوا عَنْ عِلْمِهَا وَجَدُّوا فِي الطَّلَبِ","x":"Vâhidî: Esbâb-ı nüzûl hakkında, inişe şahit olan, sebeplere vâkıf olan ve onu araştıranlardan rivayet ve işitme olmaksızın söz söylemek helal değildir."},{"k":"dikkat","x":"Bu konuda dikkatli olmak gerekir. Muhammed b. Sîrîn: «سَأَلْتُ عَبِيدَةَ عَنْ آيَةٍ مِنَ الْقُرْآنِ فَقَالَ: اتَّقِ اللَّهَ وَقُلْ سَدَادًا، ذَهَبَ الَّذِينَ يَعْلَمُونَ فِيمَا أُنْزِلَ مِنَ الْقُرْآنِ» (Allah'tan kork, doğruyu söyle; Kur'an'ın ne hakkında indiğini bilenler gitti.)"}]},{"h":"Esbâb-ı nüzûlün tanımı ve iki şekli","b":[{"k":"d","t":"Esbâb-ı Nüzûl","x":"Hz. Peygamber'in risalet döneminde vuku bulan ve Kur'an'ın bir veya birkaç ayetinin yahut bir suresinin inmesine yol açan olayı, durumu ya da soruyu ifade etmek üzere kullanılan terimdir."},{"k":"dikkat","x":"Vâhidî'nin **Fil olayını** sebeb-i nüzûl olarak aktarması hatalıdır; Fil olayı risaletten önce yaşanmıştır. Bu sadece geçmiş bir olayı haber vermektir. Nûh, Âd ve Semûd kıssaları da böyledir."},{"k":"h","x":"Sebeb-i nüzûl iki şekilde olur"},{"k":"tbl","r":[["Şekil","Örnek"],["**1. Bir olay meydana gelir, Kur'an o olay hakkında iner.**","\"Yakın akrabanı uyar\" ayeti inince Hz. Peygamber Safâ tepesine çıkıp tebliğ etti; Ebû Leheb'in \"Ellerin kurusun, bizi bunun için mi topladın\" sözü üzerine **Tebbet suresi** indi."],["**2. Resûlullah'a bir şey sorulur, meselenin hükmünü açıklayan ayet iner.**","Evs b. Sâmit'in Havle bint Sa'lebe'ye zıhar yapması ve Havle'nin soru sorması üzerine **Mücâdele suresi** indi."]]}]},{"h":"Esbâb-ı nüzûlün faydaları (7 madde)","b":[{"k":"n","n":1,"x":"**Kur'an'ın meselelere bakış açısını kavramamızı sağlar**; güncel meselelere Kur'anî perspektiften bakmamızı sağlar."},{"k":"n","n":2,"x":"**Ayet veya surenin ilahi maksada uygun yorumlanmasını sağlar.**"},{"k":"ar","a":"إِنَّ الصَّفَا وَالْمَرْوَةَ مِنْ شَعَائِرِ اللَّهِ فَمَنْ حَجَّ الْبَيْتَ أَوِ اعْتَمَرَ فَلَا جُنَاحَ عَلَيْهِ أَنْ يَطَّوَّفَ بِهِمَا","x":"Bakara 2/158"},{"k":"ornek","x":"Zahiren sa'y yapmak mubah gibi görünür; hâlbuki vaciptir. Mubah olması için «أَنْ لَا يَطَّوَّفَ بِهِمَا» şeklinde olmalıydı (Hz. Âişe–Urve olayı). **Sebebi:** Cahiliye döneminde Safâ ve Merve'de İsâf ve Nâile adlı iki put vardı; Müslümanlar bu yüzden sa'y yapmaktan çekinince ayet indi."},{"k":"n","n":3,"x":"**Problemli görülen ayetlerdeki problem giderilir.** Mervân b. Hakem «لَا تَحْسَبَنَّ الَّذِينَ يَفْرَحُونَ بِمَا أَتَوْا» (Âl-i İmrân 3/188) ayetini anlamakta zorlanmış: \"Her sevinen ve yapmadığıyla övülmek isteyen azap görecekse hepimiz azap göreceğiz\" demişti. İbn Abbas açıkladı: Ayet ehl-i kitap hakkında inmiştir. Hz. Peygamber onlara bir şey sormuş; cevabı gizleyip başka şeyler söylemiş, sorulana cevap vermiş gibi övülmeyi beklemiş ve cevabı gizledikleri için sevinmişlerdi."},{"k":"n","n":4,"x":"**Mübhem ayetlerin anlaşılmasını kolaylaştırır.** Mübhemler akılla değil nakille tespit edilir. Örnek: Abese (Abdullah b. Ümmü Mektûm), «إِنَّ شَانِئَكَ» (Âs b. Vâil)."},{"k":"n","n":5,"x":"**Ayet ve sureler arasında münasebet kurmaya yardımcı olur.** A'râf 7/31–32 «يَا بَنِي آدَمَ خُذُوا زِينَتَكُمْ عِنْدَ كُلِّ مَسْجِدٍ وَكُلُوا وَاشْرَبُوا» Kâbe'yi çıplak tavaf edenler hakkında inmiştir. Kelbî: Cahiliye ehli hac günlerinde azıktan başka yemek yemez, yağ yemezdi; Müslümanlar \"Buna biz daha layığız\" deyince \"yiyin, için\" ayeti indi."},{"k":"n","n":6,"x":"**Hasr veya tahsis şüphesini ortadan kaldırır.**"},{"k":"ar","a":"قُلْ لَا أَجِدُ فِي مَا أُوحِيَ إِلَيَّ مُحَرَّمًا عَلَى طَاعِمٍ يَطْعَمُهُ إِلَّا أَنْ يَكُونَ مَيْتَةً أَوْ دَمًا مَسْفُوحًا أَوْ لَحْمَ خِنْزِيرٍ","x":"En'âm 6/145"},{"k":"ornek","x":"Müşriklere göre bu ayette sayılanların haram olması için hiçbir sebep yoktu; onlara bu ayetle cevap verildi: Haram olacak bir şey varsa o da sizin helal kabul ettiğiniz bu şeylerdir. Ayet hasr için değil, onların iddiasına zıt bir cevaptır; tıpkı \"Bugün tatlı yeme\" diyene \"Bugün ancak tatlı yerim\" demek gibi."},{"k":"n","n":7,"x":"**Ayetin kim hakkında indiğinin bilinmesi kişiler arasındaki husumeti kaldırır.**"},{"k":"ar","a":"وَالَّذِي قَالَ لِوَالِدَيْهِ أُفٍّ لَكُمَا أَتَعِدَانِنِي أَنْ أُخْرَجَ وَقَدْ خَلَتِ الْقُرُونُ مِنْ قَبْلِي","x":"Ahkâf 46/17"},{"k":"ornek","x":"Muâviye oğlu Yezîd'i veliaht tayin edip insanların ona biat etmesini istedi; Medine valisi Mervân insanları toplayıp biat etmelerini emretti. Abdurrahman b. Ebû Bekir biat etmeyince Mervân bu ayetin onun hakkında indiği iftirasını attı. Hz. Âişe: \"Bu ayet Abdurrahman hakkında inmedi; istesem kim hakkında indiğini söylerim\" dedi."}]},{"h":"\"Hüküm, lafzın umumuna göredir; sebebin hususiliğine göre değil\" kaidesi","b":[{"k":"ar","a":"الْعِبْرَةُ بِعُمُومِ اللَّفْظِ لَا بِخُصُوصِ السَّبَبِ","x":""},{"k":"tbl","r":[["Görüş","Açıklama"],["**1. Cumhur: lafzın umumuna itibar edilir**","Lian ayetinde olduğu gibi: sebep Hilâl b. Ümeyye hakkında olsa da hüküm, başka bir delile ihtiyaç olmaksızın başkalarını da kapsar. **Tercihe şayan görüş budur.**"],["**2. Bazı âlimler: sebebin hususiliğine itibar edilir**",""]]},{"k":"li","x":"Muhammed b. Ka'b el-Kurazî: «إِنَّ الْآيَةَ تَنْزِلُ فِي الرَّجُلِ ثُمَّ تَكُونُ عَامَّةً بَعْدُ» (Ayet bir kişi hakkında iner, sonra umumi olur.)"},{"k":"li","x":"Necde el-Hanefî İbn Abbas'a «وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا» ayetini sordu: \"Hususi mi, umumi mi?\" İbn Abbas: \"Bilakis umumidir.\""}]},{"h":"Esbâb-ı nüzûl rivayetleri için kullanılan tabirler ve örnekler","b":[{"k":"tbl","r":[["Tür","Nasıl anlaşılır","Örnek lafızlar"],["**1. Sarih** (sebebe kesin delalet eder)","\"Sebep\" kelimesinin bizzat zikredilmesi veya başta \"fâ-i sebebiyye\"nin kullanılması","«سَبَبُ نُزُولِ الْآيَةِ» · «فَنَزَلَتِ الْآيَةُ» · «فَأَنْزَلَ اللَّهُ» · «فَقَالَ اللَّهُ»"],["**2. Gayr-i sarih** (kesin delalet etmez)","Sebep kelimesi ve fâ-i sebebiyye yoksa; sebebe delalet edebileceği gibi sahabe veya tâbiînin bir durumla ayet arasında ilişki kurması da olabilir","«نَزَلَتْ هَذِهِ الْآيَةُ فِي كَذَا»"]]},{"k":"li","x":"**İbn Teymiyye:** \"Bu ayet şu konuda indi\" sözüyle bazen nüzul sebebi, bazen de sebep olmasa bile o şeyin ayetin kapsamına girdiği kastedilir."},{"k":"li","x":"**Zerkeşî (el-Burhân):** Sahabe ve tâbiînin âdetindendir ki biri \"bu ayet şu konuda indi\" dediğinde ayetin bu hükmü içerdiğini kasteder; bu, ayetle hükme istidlal türündendir, olayın nakli türünden değildir."},{"k":"h","x":"Bazı örnekler"},{"k":"ornek","x":"İbn Abbas: Hz. Peygamber Medine'ye geldiğinde Medineliler ölçüde en kötü insanlardandı; **Allah indirdi:** «وَيْلٌ لِلْمُطَفِّفِينَ» (sarih: «فَأَنْزَلَ اللَّهُ»)"},{"k":"ornek","x":"İbn Abbas: Hz. Peygamber'e Kur'an inince ezberlemek için acele ederdi; **Allah buyurdu:** «لَا تُحَرِّكْ بِهِ لِسَانَكَ لِتَعْجَلَ بِهِ» (sarih: «فَقَالَ اللَّهُ»)"},{"k":"ornek","x":"«فَأَمَّا الَّذِينَ فِي قُلُوبِهِمْ زَيْغٌ» Hasan-ı Basrî: Hâricîler hakkında indi (gayr-i sarih: «نَزَلَتْ فِي»)"},{"k":"ornek","x":"Muğîre b. Şu'be: «يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَخُونُوا اللَّهَ وَالرَّسُولَ» ayeti Hz. Osman'ın katli hakkında indi (gayr-i sarih)"}]},{"h":"Rivayetlerin çeşitliliği (aynı âyet için birden fazla sebep varsa)","b":[{"k":"steps","x":["**1. Sigalar sarih değilse** («نَزَلَتْ هَذِهِ الْآيَةُ فِي كَذَا»): Maksat tefsirdir, sebeb-i nüzûl değildir; çelişki yoktur.","**2. Biri sarih, diğeri değilse:** Sarih olana itimat edilir; açık olmayan siga istinbat ve tefsir sayılır.","**3. İkisi de sarihse:** İsnadı sahih olan tercih edilir.","**4. İsnadın sahihliğinde de eşitse:** Ercah olan tercih edilir. Ercahtan maksat: (a) ravinin olayın vukuunda hazır bulunması, (b) rivayetlerden birinin daha sahih olması.","**5. Tercihte de eşitse:** Araları uzlaştırılır (cem').","**6. Zaman uzaklığından cem' de mümkün değilse:** Nüzulün taaddüt ve tekerrür ettiğine hamledilir."]},{"k":"h","x":"Örnekler"},{"k":"tbl","r":[["Durum","Örnek"],["**2. Sarih + gayr-i sarih**","«نِسَاؤُكُمْ حَرْثٌ لَكُمْ» (Bakara 2/223): İbn Ömer \"kadınlara arkadan yaklaşmak hakkında indi\" dedi (gayr-i sarih). Câbir: Yahudiler \"kadına arkasından yaklaşılırsa çocuk şaşı olur\" derdi, **bunun üzerine indi** (sarih). Câbir'in rivayeti esastır; İbn Ömer'inki istinbat ve tefsirdir."],["**3. İsnadı sahih olan**","Duhâ suresi: Buhârî ve Müslim'deki Cündeb rivayeti (Hz. Peygamber iki-üç gece kalkamayınca bir kadının \"şeytanın seni terk etti\" demesi) ile Taberânî'deki köpek yavrusu rivayeti. İbn Hacer: Köpek yavrusu kıssası meşhurdur ama sebeb-i nüzûl olması garibtir; isnadında tanınmayan biri vardır. **Muteber olan Sahîhayn'dakidir.**"],["**4. Ercah olan**","«وَيَسْأَلُونَكَ عَنِ الرُّوحِ» (İsrâ 17/85): Buhârî'de İbn Mes'ûd Medine'de Yahudilerin sorusu üzerine indiğini anlatır; Tirmizî'de İbn Abbas, Kureyş'in Yahudilere danışması üzerine Mekke'de indiğini anlatır. **Buhârî rivayeti tercih edilir:** İbn Mes'ûd olayın içindedir ve Buhârî Tirmizî'den daha sahihtir."],["**5. Cem'**","Lian ayetleri «وَالَّذِينَ يَرْمُونَ أَزْوَاجَهُمْ» (Nûr 24/6): Hilâl b. Ümeyye hakkında (Buhârî, Tirmizî, İbn Mâce) ve Uveymir hakkında (Buhârî, Müslim) rivayetler var. Önce Hilâl'in olayı olmuş, Uveymir'in gelişi ona denk gelmiş; ayet ikisinin hakkında birlikte inmiştir."],["**6. Tekerrür**","«وَإِنْ عَاقَبْتُمْ فَعَاقِبُوا بِمِثْلِ مَا عُوقِبْتُمْ بِهِ وَلَئِنْ صَبَرْتُمْ لَهُوَ خَيْرٌ لِلصَّابِرِينَ» (Nahl 16/126). Ebû Hüreyre: Uhud'da Hz. Hamza şehit edilince Hz. Peygamber başucunda \"Senin yerine onlardan 70 kişiyi öldüreceğim\" dedi; oradan ayrılmadan ayet indi. Übey b. Ka'b: Müslümanlar \"fırsat geçse intikamını fazlasıyla alırız\" dediler; Mekke fethi günü ayet indi. **Uhud ile Mekke fethi arası 5 yıldır.**"]]},{"k":"h","x":"Nüzulün tekerrürü"},{"k":"li","x":"**Süyûtî, Zerkeşî ve İbn Teymiyye** nüzulün tekerrürünü kabul eder. Bu tekerrür ayetin şanını yüceltir ve unutulmamasını sağlar."},{"k":"dikkat","x":"**Muhsin Demirci:** Bir ayetin iki defa nazil olmasının izahı zordur; ashabın Kur'an konusundaki hassasiyetine zarar verir ve Hz. Peygamber'in tebliğde lakayt davrandığını gösterir. Kanaatimizce bu ayetler Uhud'dan sonra inmiş, Mekke fethinde Müslümanlar zulmeder endişesiyle hatırlatılmıştır. Übey b. Ka'b'ın bu anlamdaki rivayeti, ondan nakleden raviler tarafından yeni inmiş ayet şeklinde algılanıp aktarılmıştır."}]},{"h":"Sebep bir, nüzûl birden fazla olması","b":[{"k":"ar","a":"قَدْ يَتَعَدَّدُ مَا يَنْزِلُ وَالسَّبَبُ وَاحِدٌ، وَلَا شَيْءَ فِي ذَلِكَ، فَقَدْ يَنْزِلُ فِي الْوَاقِعَةِ الْوَاحِدَةِ آيَاتٌ عَدِيدَةٌ فِي سُوَرٍ شَتَّى","x":"Sebep tek olduğu hâlde inen birden fazla olabilir; tek bir olay hakkında farklı surelerde birçok ayet inebilir."},{"k":"li","x":"Ümmü Seleme'nin kadınların zikredilmemesiyle ilgili soruları üzerine üç ayet inmiştir:"},{"k":"steps","x":["«فَاسْتَجَابَ لَهُمْ رَبُّهُمْ أَنِّي لَا أُضِيعُ عَمَلَ عَامِلٍ مِنْكُمْ مِنْ ذَكَرٍ أَوْ أُنْثَى» (Âl-i İmrân 3/195): \"Hicrette kadınlardan bir şey anıldığını işitmiyorum\" sorusu üzerine.","«إِنَّ الْمُسْلِمِينَ وَالْمُسْلِمَاتِ وَالْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ…» (Ahzâb 33/35): \"Neden erkekler gibi Kur'an'da anılmıyoruz?\" sorusu üzerine.","«وَلَا تَتَمَنَّوْا مَا فَضَّلَ اللَّهُ بِهِ بَعْضَكُمْ عَلَى بَعْضٍ» (Nisâ 4/32): \"Erkekler savaşıyor, biz savaşmıyoruz; mirasta da yarı payımız var\" sözü üzerine."]},{"k":"li","x":"«فَهَذِهِ الْآيَاتُ الثَّلَاثُ نَزَلَتْ عَلَى سَبَبٍ وَاحِدٍ» Bu üç ayet tek sebep üzerine inmiştir."}]},{"h":"Âyetin nüzûlünün hükümden önce gelmesi","b":[{"k":"li","x":"**Zerkeşî**'nin bu fikrini **Beğavî** mümkün görmektedir."},{"k":"tbl","r":[["Ayet","Açıklama"],["«قَدْ أَفْلَحَ مَنْ تَزَكَّى» (A'lâ 87/14)","Zekâtü'l-fıtr'a delil getirilir; Beyhakî İbn Ömer'den Ramazan'daki fıtır sadakası hakkında indiğini rivayet eder. Bazıları: Sure Mekkîdir, Mekke'de bayram da zekât da yoktu; bu te'vilin yönünü bilmiyorum."],["«سَيُهْزَمُ الْجَمْعُ وَيُوَلُّونَ الدُّبُرَ» (Kamer 54/45)","Mekke'de indi. Hz. Ömer: \"Hangi topluluk bozguna uğrayacak, bilmiyordum. Bedir günü Resûlullah'ı bu ayeti okurken görünce anladım.\""]]},{"k":"not","x":"Bu örnekler, ayetin özel bir hüküm hakkında inip onunla ancak sonra amel edildiğine kesin delil değildir; ayet birden fazla manaya ihtimali olan mücmel bir lafızla inmiş, sonra sonradan gelen bir hükme delil olacak şekilde manalarından birine hamledilmiş olabilir."}]},{"h":"Bir kişi hakkında birden fazla âyet inmesi","b":[{"k":"li","x":"Bazen sahabeden biri için birden fazla olay meydana gelir ve her olayın durumuna göre ayet iner."},{"k":"li","x":"Buhârî'nin rivayetinde **Sa'd b. Ebî Vakkâs**: \"Benim hakkımda **dört ayet** nazil oldu\" demiştir."},{"k":"li","x":"**Hz. Ömer'in muvafakatı** da bu kabildendir: Vahiy birçok ayette Hz. Ömer'in görüşüne uygun inmiştir."}]}],"ht":[{"s":0,"x":"Esbâb-ı nüzûl eserleri: Vâhidî (Esbâbü'n-Nüzûl), İbn Teymiyye (et-Tibyân), Süyûtî (Lübâbü'n-Nükûl)."},{"s":1,"x":"Sebeb-i nüzûl sahih rivayetle bilinir; sahabenin sarih haberi merfû hükmündedir."},{"s":2,"x":"Tanımın kilit kaydı: olay \"risalet döneminde\" olmalıdır; Fil olayı sebeb-i nüzûl değildir."},{"s":2,"x":"İki şekil: olay üzerine (Tebbet) ve soru üzerine (Mücâdele)."},{"s":3,"x":"Esbâb-ı nüzûlün 7 faydası: bakış açısı · ilahi maksada uygun yorum (Safâ–Merve) · problemi gidermek (Âl-i İmrân 188) · mübhemi bilmek · münasebet · hasr şüphesini kaldırmak (En'âm 145) · husumeti kaldırmak (Abdurrahman b. Ebû Bekir)."},{"s":4,"x":"Cumhura göre ibret lafzın umumundadır (Lian ayeti, Hilâl b. Ümeyye)."},{"s":5,"x":"Sarih: \"sebep\" kelimesi veya fâ-i sebebiyye (fe-enzela, fe-nezelet). Gayr-i sarih: \"nezelet fî kezâ\" (tefsir de olabilir)."},{"s":6,"x":"Birden fazla sebep: sarih değilse tefsir · biri sarihse o · ikisi sarihse isnadı sahih olan · eşitse ercah (olayda hazır olan) · o da eşitse cem' · cem' mümkün değilse tekerrür."},{"s":6,"x":"Tekerrürü kabul edenler: Süyûtî, Zerkeşî, İbn Teymiyye. Muhsin Demirci izahını zor bulur (Nahl 126 örneği)."},{"s":7,"x":"Ümmü Seleme'nin soruları üzerine üç ayet: Âl-i İmrân 195, Ahzâb 35, Nisâ 32."},{"s":8,"x":"Nüzulün hükümden önce gelmesi: A'lâ 14 (fıtır sadakası), Kamer 45 (Bedir); Zerkeşî'nin fikri, Beğavî mümkün görür."},{"s":9,"x":"Bir kişi hakkında birden çok ayet: Sa'd b. Ebî Vakkâs (4 ayet), Hz. Ömer'in muvafakatları."}]},{"t":"Kur'an'ın Tedrîcî Nüzûlü ve Esrârı","intro":"Kur'an'ın Kadir gecesinde indirilmesi, toptan indirilmesi hakkındaki dört görüş, tedricen nüzulü ve bunun hikmetleri.","s":[{"h":"Kur'an'ın nüzûlü","b":[{"k":"li","x":"Allah Teâlâ, Resûlü Hz. Muhammed'e insanlığın hidayeti için Kur'an'ı indirdi."},{"k":"li","x":"Kur'an'ın **Kadir gecesinde** indirilmesi, Allah'ın meleklerinden oluşan ulvî âleme ümmet-i Muhammed'in şerefini bildirmiş ve insanlara bu yeni risalet ile ikramda bulunulduğunu haber vermiştir."}]},{"h":"Kur'an'ın toptan indirilmesi ve bu konudaki 4 görüş","b":[{"k":"li","x":"Allah Teâlâ şöyle buyurur:"},{"k":"ar","a":"شَهْرُ رَمَضَانَ الَّذِي أُنْزِلَ فِيهِ الْقُرْآنُ هُدًى لِلنَّاسِ وَبَيِّنَاتٍ مِنَ الْهُدَى وَالْفُرْقَانِ","x":"Bakara 2/185"},{"k":"ar","a":"إِنَّا أَنْزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ","x":"Kadr 97/1"},{"k":"ar","a":"إِنَّا أَنْزَلْنَاهُ فِي لَيْلَةٍ مُبَارَكَةٍ","x":"Duhân 44/3"},{"k":"sc","q":"Bu üç ayet çelişiyor mu?","x":"Bu üç ayette çelişki yoktur; mübarek gece Kadir gecesidir. Ancak zahirleri, Resûlullah'ın hayatındaki fiilî durumla çelişir görünür; çünkü Kur'an 23 yılda nazil olmuştur. Âlimlerin bu konuda iki temel görüşü vardır."},{"k":"tbl","r":[["Görüş","Kimin görüşü","Açıklama","Değerlendirme"],["**1. Beytü'l-İzze'ye toptan, sonra peyderpey**","İbn Abbas ve bir cemaat; **cumhurun görüşü**","Melekler katında şanını yüceltmek için dünya semasındaki Beytü'l-İzze'ye toptan indirildi; sonra bi'setten vefata kadar olaylara göre peyderpey indi.","Kurtubî, Mukâtil b. Hayyân'dan Levh-i Mahfûz'dan Beytü'l-İzze'ye toptan inişte **icma** olduğunu nakletmiştir. İbn Abbas'tan sahih haberler vardır."],["**2. Kadir gecesinde inmeye başladı**","Şa'bî","Ayetlerdeki indirmeden maksat, Ramazan'ın Kadir gecesinde indirilmeye başlanmasıdır; sonra yaklaşık 23 yılda olaylara göre tedricen devam etmiştir.","Her ayet aynı zamanda Kur'an'dır."],["**3. 23 Kadir gecesinde yıllık**","Bazı müfessirler","Her yılın Kadir gecesinde o yıl inecek miktar dünya semasına indirildi; oradan bütün yıl boyunca parça parça Resûlullah'a iniyordu.","Bu görüş bazı müfessirlerin içtihadıdır; **hiçbir delili yoktur.**"],["**4. Levh-i Mahfûz → Beytü'l-İzze → peyderpey**","","Önce Levh-i Mahfûz'a, oradan Beytü'l-İzze'ye, oradan olaylara göre peyderpey nazil oldu.",""]]},{"k":"h","x":"1. görüşü destekleyen İbn Abbas rivayetleri"},{"k":"ar","a":"عَنِ ابْنِ عَبَّاسٍ قَالَ: أُنْزِلَ الْقُرْآنُ جُمْلَةً وَاحِدَةً إِلَى السَّمَاءِ الدُّنْيَا لَيْلَةَ الْقَدْرِ، ثُمَّ أُنْزِلَ بَعْدَ ذَلِكَ فِي عِشْرِينَ سَنَةً","x":"Sonra şu ayetleri okudu: «وَلَا يَأْتُونَكَ بِمَثَلٍ إِلَّا جِئْنَاكَ بِالْحَقِّ وَأَحْسَنَ تَفْسِيرًا» ve «وَقُرْآنًا فَرَقْنَاهُ لِتَقْرَأَهُ عَلَى النَّاسِ عَلَى مُكْثٍ وَنَزَّلْنَاهُ تَنْزِيلًا»"},{"k":"ar","a":"عَنِ ابْنِ عَبَّاسٍ قَالَ: فُصِلَ الْقُرْآنُ مِنَ الذِّكْرِ فَوُضِعَ فِي بَيْتِ الْعِزَّةِ مِنَ السَّمَاءِ الدُّنْيَا، فَجَعَلَ جِبْرِيلُ يَنْزِلُ بِهِ عَلَى النَّبِيِّ","x":""},{"k":"ar","a":"عَنِ ابْنِ عَبَّاسٍ قَالَ: أُنْزِلَ الْقُرْآنُ فِي لَيْلَةِ الْقَدْرِ فِي شَهْرِ رَمَضَانَ إِلَى سَمَاءِ الدُّنْيَا جُمْلَةً وَاحِدَةً، ثُمَّ أُنْزِلَ نُجُومًا","x":""},{"k":"h","x":"2. görüşün izahı"},{"k":"li","x":"«إِنَّا أَنْزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ»: Kur'an'ı Kadir gecesinde indirdik (**indirmeye başladık**)."},{"k":"li","x":"**Ömer Nasuhi Bilmen:** Bir mushaftaki ayet ve surelerin tamamına Kur'an denildiği gibi, herhangi bir ayete veya sureye de Kur'an denilebilir."},{"k":"ornek","x":"Bir çocuk 3 kilo ağırlığında doğar; otuz yıl sonra 85 kilo bir yetişkin olur. Doğduğunda da ismi aynıdır, bugün de. Kur'an da ilk ayetin indiği gece de Kur'an'dır, tamamlandığında da."}]},{"h":"Kur'an'ın tedrîcen nüzûlü","b":[{"k":"li","x":"Kur'an'ın inzali tedricîdir: fert ve toplum ihtiyaçlarına göre 23 yıl boyunca azar azar indirilmiştir. Bu görüşü destekleyen ayetler vardır:"},{"k":"ar","a":"وَإِنَّهُ لَتَنْزِيلُ رَبِّ الْعَالَمِينَ، نَزَلَ بِهِ الرُّوحُ الْأَمِينُ، عَلَى قَلْبِكَ لِتَكُونَ مِنَ الْمُنْذِرِينَ، بِلِسَانٍ عَرَبِيٍّ مُبِينٍ","x":"Şuarâ 26/192–195"},{"k":"ar","a":"تَنْزِيلُ الْكِتَابِ مِنَ اللَّهِ الْعَزِيزِ الْحَكِيمِ","x":"Zümer 39/1"},{"k":"ar","a":"وَإِنْ كُنْتُمْ فِي رَيْبٍ مِمَّا نَزَّلْنَا عَلَى عَبْدِنَا فَأْتُوا بِسُورَةٍ مِنْ مِثْلِهِ","x":"Bakara 2/23"},{"k":"not","x":"Bu ayetlerde **inzâl** yerine **tenzîl** kavramının kullanılması tedrice işarettir."},{"k":"li","x":"**Diğer semavi kitaplar bir bütün hâlinde indirilmiştir.** Semavi kitaplar peyderpey indirilseydi kâfirler Kur'an'ın parça parça indirilmesine şaşırmazdı:"},{"k":"ar","a":"وَقَالَ الَّذِينَ كَفَرُوا لَوْلَا نُزِّلَ عَلَيْهِ الْقُرْآنُ جُمْلَةً وَاحِدَةً كَذَلِكَ لِنُثَبِّتَ بِهِ فُؤَادَكَ وَرَتَّلْنَاهُ تَرْتِيلًا","x":"Furkân 25/32"},{"k":"tbl","r":[["","Kur'an","Diğer semavi kitaplar"],["İniş","Tedricen, 23 yılda (tenzîl)","Bir bütün hâlinde"],["Delil","\"Tenzîl\" kalıbı; Furkân 32","Kâfirlerin \"toptan inseydi\" itirazı"]]}]},{"h":"Tedrîcî nüzûlün hikmetleri","b":[{"k":"tbl","r":[["Hikmet","Özü"],["**1. Hz. Peygamber'in kalbini pekiştirmek**","Sürekli Allah ile irtibat, sıkıntılara göğüs germe"],["**2. Muhataplara meydan okuma ve i'caz**","\"Sana soruyorlar\" ayetleriyle sorulara anında cevap"],["**3. Ezberlemeyi ve anlamayı kolaylaştırmak**","Sahabe 23 yılda hâfız oldu"],["**4. Hüküm koymada derece derece ilerleme**","Önce iman esasları, sonra ahkâm; içkinin 4 aşamada haram kılınması"],["**5. Kur'an'ın Allah tarafından indirildiğine kesin delalet**","23 yıla yayılmasına rağmen insicam"]]},{"k":"h","x":"Hz. Peygamber'in kalbini pekiştirmek"},{"k":"li","x":"Peygamber Efendimiz davete başladığında müşriklerden nefret, katılık ve çeşitli eziyetler gördü. Kur'an'ın tedricen inmesi onun sürekli Allah ile irtibat hâlinde olmasını ve sıkıntılara göğüs germesini sağladı."},{"k":"ar","a":"فَاصْبِرْ كَمَا صَبَرَ أُولُو الْعَزْمِ مِنَ الرُّسُلِ","x":"Ahkâf 46/35"},{"k":"ar","a":"وَاصْبِرْ عَلَى مَا يَقُولُونَ وَاهْجُرْهُمْ هَجْرًا جَمِيلًا، وَذَرْنِي وَالْمُكَذِّبِينَ أُولِي النَّعْمَةِ وَمَهِّلْهُمْ قَلِيلًا","x":"Müzzemmil 73/10–11"},{"k":"ar","a":"وَلَا يَحْزُنْكَ قَوْلُهُمْ إِنَّ الْعِزَّةَ لِلَّهِ جَمِيعًا هُوَ السَّمِيعُ الْعَلِيمُ","x":"Yûnus 10/65"},{"k":"ar","a":"وَكُلًّا نَقُصُّ عَلَيْكَ مِنْ أَنْبَاءِ الرُّسُلِ مَا نُثَبِّتُ بِهِ فُؤَادَكَ","x":"Hûd 11/120"},{"k":"h","x":"Muhataplarına karşı meydan okuma ve i'caz"},{"k":"li","x":"«يَسْأَلُونَكَ عَنِ…» tarzı ayetlerle sorularına cevap verme. Örnek: Übey b. Halef / Âs b. Vâil / Ebû Cehil'in çürümüş kemiği ufalayarak sorması:"},{"k":"ar","a":"وَضَرَبَ لَنَا مَثَلًا وَنَسِيَ خَلْقَهُ قَالَ مَنْ يُحْيِي الْعِظَامَ وَهِيَ رَمِيمٌ، قُلْ يُحْيِيهَا الَّذِي أَنْشَأَهَا أَوَّلَ مَرَّةٍ","x":"Yâsîn 36/78–79"},{"k":"h","x":"Ezberlemeyi ve anlamayı kolaylaştırmak"},{"k":"li","x":"Kur'an okuma yazma bilmeyen ve her şeyi ezberleyerek kayıt altında tutan bir ümmete nazil oldu. Bir bütün olarak inseydi ezberlenmesi, manasının anlaşılması ve üzerinde tefekkür kolay olmazdı."},{"k":"li","x":"Parça parça inmesi sadırlarda ezberlenmesini ve anlaşılmasını kolaylaştırdı. Her ayet indiğinde sahabe onu ezberler, manasını düşünür ve hükümlerine vâkıf olurdu. **Sahabe 23 yılda hâfız oldu.**"},{"k":"ar","a":"وَعَنْ عُمَرَ قَالَ: تَعَلَّمُوا الْقُرْآنَ خَمْسَ آيَاتٍ خَمْسَ آيَاتٍ، فَإِنَّ جِبْرِيلَ كَانَ يَنْزِلُ بِالْقُرْآنِ عَلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خَمْسًا خَمْسًا","x":"Hz. Ömer: Kur'an'ı beşer beşer ayet öğrenin; Cebrâil Kur'an'ı Hz. Peygamber'e beşer beşer indirirdi."},{"k":"h","x":"Hüküm koymada derece derece ilerleme"},{"k":"li","x":"Kur'an onları hikmetle tedavi etmeseydi ve şifalı ilaçlarından bir yudum vererek fesattan kurtarmasaydı, bu yeni dine hızlıca bağlanmaları kolay olmazdı."},{"k":"li","x":"Kur'an başlangıçta Allah'a, meleklere, kitaplara, kıyamete, yeniden dirilişe, hesaba, cennet ve cehenneme imanı yerleştirmek ve putperestliği kalplerden söküp atmak için deliller getirir. **Ahkâm ayetleri daha sonra iner.**"},{"k":"h5","x":"İçkinin 4 aşamada haram kılınması"},{"k":"steps","x":["**Nahl 16/67:** «وَمِنْ ثَمَرَاتِ النَّخِيلِ وَالْأَعْنَابِ تَتَّخِذُونَ مِنْهُ سَكَرًا وَرِزْقًا حَسَنًا إِنَّ فِي ذَلِكَ لَآيَةً لِقَوْمٍ يَعْقِلُونَ»","**Bakara 2/219:** «يَسْأَلُونَكَ عَنِ الْخَمْرِ وَالْمَيْسِرِ قُلْ فِيهِمَا إِثْمٌ كَبِيرٌ وَمَنَافِعُ لِلنَّاسِ وَإِثْمُهُمَا أَكْبَرُ مِنْ نَفْعِهِمَا»","**Nisâ 4/43:** «يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَقْرَبُوا الصَّلَاةَ وَأَنْتُمْ سُكَارَى حَتَّى تَعْلَمُوا مَا تَقُولُونَ»","**Mâide 5/90:** «يَا أَيُّهَا الَّذِينَ آمَنُوا إِنَّمَا الْخَمْرُ وَالْمَيْسِرُ وَالْأَنْصَابُ وَالْأَزْلَامُ رِجْسٌ مِنْ عَمَلِ الشَّيْطَانِ فَاجْتَنِبُوهُ لَعَلَّكُمْ تُفْلِحُونَ»"]},{"k":"h5","x":"Hz. Âişe'nin meşhur sözü"},{"k":"ar","a":"إِنَّمَا نَزَلَ أَوَّلَ مَا نَزَلَ مِنْهُ سُورَةٌ مِنَ الْمُفَصَّلِ فِيهَا ذِكْرُ الْجَنَّةِ وَالنَّارِ، حَتَّى إِذَا ثَابَ النَّاسُ إِلَى الْإِسْلَامِ نَزَلَ الْحَلَالُ وَالْحَرَامُ، وَلَوْ نَزَلَ أَوَّلَ شَيْءٍ: لَا تَشْرَبُوا الْخَمْرَ، لَقَالُوا: لَا نَدَعُ الْخَمْرَ أَبَدًا، وَلَوْ نَزَلَ: لَا تَزْنُوا، لَقَالُوا: لَا نَدَعُ الزِّنَا أَبَدًا","x":"İlk önce cennet ve cehennemin anlatıldığı mufassal sureler indi; insanlar İslam'a yönelince helal ve haram indi. İlk önce \"içki içmeyin\" inseydi \"içkiyi asla bırakmayız\" derlerdi; \"zina etmeyin\" inseydi \"zinayı asla bırakmayız\" derlerdi."},{"k":"h","x":"Kur'an'ın Allah tarafından indirildiğine kesin delaleti"},{"k":"li","x":"Bu Kur'an çeşitli münasebetler, peş peşe olaylar ve art arda gelen hadiseler hakkında söylenmiş bir insan sözü olsaydı onda dağılma ve çözülme olur, ayetler arasında uygunluk ve insicam zorlaşırdı."},{"k":"li","x":"Allah Resûlü'nün hadisleri Kur'an'dan sonra fesahat ve belagatin zirvesinde olduğu hâlde, bunlar bile bir kitap içinde Kur'an gibi birbirine bağlı ve düzenli bir söz dizisi meydana getiremez."}]}],"ht":[{"s":0,"x":"Kur'an'ın Kadir gecesinde inmesi ulvî âleme ümmetin şerefini bildirir."},{"s":1,"x":"Toptan indirilme: 1. görüş Beytü'l-İzze'ye toptan, sonra peyderpey (İbn Abbas, cumhur; Kurtubî icma nakleder)."},{"s":1,"x":"2. görüş (Şa'bî): Kadir gecesinde inmeye başladı. 3. görüş (yıllık Kadir geceleri) delilsizdir."},{"s":2,"x":"Tedricen iniş: inzâl yerine tenzîl; diğer kitaplar toptan indi (Furkân 32)."},{"s":3,"x":"Tedricî nüzulün 5 hikmeti: Peygamber'in kalbini pekiştirmek · meydan okuma ve i'caz · ezber ve anlamayı kolaylaştırmak · hükümde tedric · Allah katından olduğuna delalet."},{"s":3,"x":"İçki 4 aşamada: Nahl 67 → Bakara 219 → Nisâ 43 → Mâide 90."}]},{"t":"Kur'an'ın Metinleşmesiyle İlgili Faaliyetler","intro":"Kur'an'ın Resûlullah, Hz. Ebû Bekir ve Hz. Osman dönemlerinde cem'i ile harekeleme ve noktalama faaliyetleri.","s":[{"h":"Kur'an'ın cem'i ve tertibi","b":[{"k":"li","x":"Kur'an'ın cem'i iki manada kullanılır:"},{"k":"n","n":1,"x":"**Hıfz (ezberleme):** Hz. Peygamber Kur'an'ı ezberlemeye çok hırslıydı."},{"k":"n","n":2,"x":"**Kitâbet (yazma):** Ayet ve surelerin yazılması."},{"k":"h","x":"Üç cem'"},{"k":"tbl","r":[["Dönem","Adı","Mahiyeti","Sebebi"],["**A. Resûlullah zamanı**","**Cem-i evvel**","Hıfz ve kitâbet","Vahyin korunması"],["**B. Hz. Ebû Bekir zamanı**","**Cem-i sânî**","Dağınık yazıların tek mushafta toplanması","Yemâme'de kurrânın şehit olması"],["**C. Hz. Osman zamanı**","**Cem-i sâlis**","İstinsah (çoğaltma)","Kıraat ihtilafı"]]}]},{"h":"A. Resûlullah devrinde cem' (hıfz ve kitâbet)","b":[{"k":"h","x":"Resûlullah zamanında Kur'an'ın hıfzı"},{"k":"li","x":"Hz. Peygamber kendisine inen vahiyleri ezberlediği gibi vahiy kâtiplerine de mutlaka yazdırmıştır."},{"k":"li","x":"Buhârî'de geçen **3 hadiste** hâfızların **7** kişi olduğu zikredilir:"},{"k":"ar","a":"عَنْ عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ الْعَاصِ قَالَ: سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: خُذُوا الْقُرْآنَ مِنْ أَرْبَعَةٍ: مِنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ، وَسَالِمٍ، وَمُعَاذٍ، وَأُبَيِّ بْنِ كَعْبٍ","x":""},{"k":"ar","a":"وَعَنْ قَتَادَةَ قَالَ: سَأَلْتُ أَنَسَ بْنَ مَالِكٍ: مَنْ جَمَعَ الْقُرْآنَ عَلَى عَهْدِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ؟ فَقَالَ: أَرْبَعَةٌ، كُلُّهُمْ مِنَ الْأَنْصَارِ: أُبَيُّ بْنُ كَعْبٍ، وَمُعَاذُ بْنُ جَبَلٍ، وَزَيْدُ بْنُ ثَابِتٍ، وَأَبُو زَيْدٍ","x":""},{"k":"ar","a":"وَرُوِيَ مِنْ طَرِيقِ ثَابِتٍ عَنْ أَنَسٍ قَالَ: مَاتَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَلَمْ يَجْمَعِ الْقُرْآنَ غَيْرُ أَرْبَعَةٍ: أَبُو الدَّرْدَاءِ، وَمُعَاذُ بْنُ جَبَلٍ، وَزَيْدُ بْنُ ثَابِتٍ، وَأَبُو زَيْدٍ","x":""},{"k":"h","x":"Yedi hâfız"},{"k":"tbl","r":[["#","Hâfız"],["1","Abdullah b. Mes'ûd"],["2","Ebû Huzeyfe'nin âzatlısı Sâlim b. Ma'kıl"],["3","Muâz b. Cebel"],["4","Übey b. Ka'b"],["5","Zeyd b. Sâbit"],["6","Ebû Zeyd Kays b. Seken"],["7","Ebü'd-Derdâ"]]},{"k":"dikkat","x":"Hâfızların yedi kişiyle sınırlandırılması, bunların Kur'an'ın tamamını ezberleyip **Resûlullah'a okumuş (arz etmiş)** kişiler olduğuna yorulmuştur; hâfızlar 7 kişiyle sınırlı değildir. Sahabe büyük şehirlere dağılmış ve Kur'an'ı birbirinden ezberlemiştir. **Bi'r-i Maûne'de öldürülen 70 hâfız** buna delil olarak yeter. Zehebî (Tabakâtü'l-Kurrâ): Bu sayı, Kur'an'ı Hz. Peygamber'e arz eden ve senedleri bize ulaşan kurrâdır; Kur'an'ı cem edip senedi bize ulaşmayanlar ise çoktur."},{"k":"h","x":"Resûlullah zamanında Kur'an'ın yazılması"},{"k":"li","x":"Resûlullah; Hz. Ali, Muâviye, Übey b. Ka'b ve Zeyd b. Sâbit gibi sahabenin büyüklerinden **vahiy kâtipleri** edinmişti. Ayetler indiğinde yazılmasını emreder, surelerdeki yerini gösterirdi. Böylece satırlardaki kitâbet ile sadırlardaki cem' birbirini destekliyordu."},{"k":"li","x":"Sahabeden bazıları, Hz. Peygamber emretmediği hâlde ayetleri kendileri için yazıyordu."},{"k":"li","x":"Yazı malzemeleri: yaprakları sıyrılmış hurma dalları, ince beyaz taşlar, hurma budak başları, kâğıt veya deri parçaları, tahta deve semerleri ve kürek kemikleri."},{"k":"li","x":"Sahabe kendisindeki Kur'an'ı ezbere veya yazılı olarak Resûlullah'a **arz** ederdi. Ali b. Ebû Tâlib, Muâz b. Cebel, Übey b. Ka'b, Zeyd b. Sâbit ve Abdullah b. Mes'ûd gibi bir grup Kur'an'ın tamamını cem edip arz etmişti. **Zeyd b. Sâbit'in arzı hepsinden sonraydı.**"},{"k":"li","x":"Resûlullah vefat ettiğinde Kur'an genel bir mushafta toplanmış değildi."},{"k":"h","x":"Kur'an'ın o dönemde tek mushafta toplanmama sebepleri"},{"k":"n","n":1,"x":"**Emînü'l-vahy (vahyin güvencesi) olan zat henüz hayattaydı;** Kur'an'ın zarar görme veya kaybolma endişesi yoktu."},{"k":"n","n":2,"x":"**Son ayet ile vefat arasındaki süre** bir rivayete göre 81 gün, çoğunluğa göre **9 gündür.** Bu süre toplamaya yetmezdi; Zeyd b. Sâbit dağınık metinleri ancak **bir yılda** toplayabilmişti."},{"k":"n","n":3,"x":"**Kur'an bir defada inmeyip çeşitli vesilelerle iniyordu;** Hz. Peygamber vahyin ne zaman kesileceğini bilmiyordu. Vahiy devam ederken iki kapak arasında toplamak söz konusu olamazdı."},{"k":"n","n":4,"x":"**Nesih ihtimali:** Bazı âlimlere göre vahiy devam ettikçe bazı ayetlerin neshedilme ihtimali vardı; Kur'an cilt hâline getirilseydi karışıklık doğabilirdi."},{"k":"n","n":5,"x":"**Yazılış sırası iniş sırasına göre değildi;** ayetler Resûlullah'ın gösterdiği yere yazılıyordu. Mushaf toplansaydı her yeni vahiyde mushafı değiştirmek gerekirdi."},{"k":"not","x":"Hz. Peygamber dönemindeki bu hıfz ve kitâbete **cem-i evvel** denir."}]},{"h":"B. Hz. Ebû Bekir devrinde cem'","b":[{"k":"h","x":"Derlemeyi gerektiren sebep"},{"k":"li","x":"Müslümanlar yalancı peygamber Müseylime'ye karşı yapılan **Yemâme savaşında** çok sayıda kurrâ şehit verince Kur'an'ın zayi olmasından korktular. Hz. Ömer'in teklifinden önce çekinen Hz. Ebû Bekir sonunda bu işe koyuldu."},{"k":"ar","a":"فَقَالَ أَبُو بَكْرٍ: إِنَّ عُمَرَ أَتَانِي فَقَالَ: إِنَّ الْقَتْلَ قَدِ اسْتَحَرَّ بِقُرَّاءِ الْقُرْآنِ، وَإِنِّي أَخْشَى أَنْ يَسْتَحِرَّ الْقَتْلُ بِالْقُرَّاءِ فِي الْمَوَاطِنِ فَيَذْهَبَ كَثِيرٌ مِنَ الْقُرْآنِ، وَإِنِّي أَرَى أَنْ تَأْمُرَ بِجَمْعِ الْقُرْآنِ. فَقُلْتُ لِعُمَرَ: كَيْفَ تَفْعَلُ شَيْئًا لَمْ يَفْعَلْهُ رَسُولُ اللَّهِ؟ قَالَ عُمَرُ: هُوَ وَاللَّهِ خَيْرٌ. فَلَمْ يَزَلْ يُرَاجِعُنِي حَتَّى شَرَحَ اللَّهُ صَدْرِي لِذَلِكَ","x":"Hz. Ebû Bekir: \"Resûlullah'ın yapmadığı bir şeyi nasıl yaparsın?\" dedim. Ömer \"Vallahi bu hayırdır\" dedi ve Allah gönlümü buna açana kadar bana başvurmaya devam etti."},{"k":"h","x":"Görevin Zeyd b. Sâbit'e verilmesi"},{"k":"li","x":"Özel olarak görevlendirilen vahiy kâtiplerinden olması."},{"k":"li","x":"Zekâsıyla sahabe arasında temayüz etmesi."},{"k":"li","x":"Resûlullah hayattayken Kur'an'ın tamamını ezberlemesi ve çok düzgün okuması."},{"k":"li","x":"**Arza-i ahîrede** hazır bulunması."},{"k":"li","x":"Genç olması; kendisinden isteneni daha rahat yapabilecek olması."},{"k":"li","x":"Güvenilir olması ve hiçbir suçlamaya maruz kalmaması."},{"k":"h","x":"Rivayetin yorumlanması; Züşşehâdeteyn"},{"k":"li","x":"Zeyd b. Sâbit, **Tevbe suresinin son iki ayetini** ve **Ahzâb suresinin 23. ayetini** yazılı olarak sadece **Huzeyme**'nin getirdiğini ve ikinci bir şahide gerek görmeden bunları mushafa aldığını belirtmiştir."},{"k":"ar","a":"وَقَدْ رَاعَى زَيْدُ بْنُ ثَابِتٍ نِهَايَةَ التَّثَبُّتِ، فَكَانَ لَا يَكْتَفِي بِالْحِفْظِ دُونَ الْكِتَابَةِ… وَإِنَّمَا الْمُرَادُ أَنَّهُ لَمْ يَجِدْهَا مَكْتُوبَةً عِنْدَ غَيْرِهِ، وَكَانَ زَيْدٌ يَحْفَظُهَا، وَكَانَ كَثِيرٌ مِنَ الصَّحَابَةِ يَحْفَظُونَهَا","x":"\"Tevbe'nin sonunu Huzeyme'den başkasında bulamadım\" sözü, ayetin mütevatir olmadığı anlamına gelmez; kastedilen, başkasında **yazılı** bulamamasıdır. Zeyd onu ezbere biliyordu, birçok sahabe de biliyordu; Zeyd hem hıfza hem yazıya dayanıyordu."},{"k":"d","t":"Züşşehâdeteyn","x":"\"Şahitliği iki şahit yerine geçen kimse\"; Hz. Peygamber'in Huzeyme'ye verdiği lakap."},{"k":"ornek","x":"Hz. Peygamber'le bir alacaklısı arasında borcun ödenip ödenmediği konusunda anlaşmazlık çıktı. Ödemeyi görmediği hâlde Huzeyme, \"Biz seni vahiy gibi daha önemli bir konuda tasdik ediyoruz\" diyerek şahitlik etti. Bunun üzerine Resûl-i Ekrem ona **züşşehâdeteyn** lakabını verdi. Zeyd'in tek şahitle yetinmesinin dayanağı budur."},{"k":"dikkat","x":"Bu rivayet söz konusu ayetlerin mevsukiyetine halel getirmez: Kur'an sahabenin zihninde mevcuttu, Zeyd b. Sâbit de hâfızdı. Ayrıca cem'de iki şahit şartı ayetle sabit değildir; bu şartı Hz. Ebû Bekir koymuştur."},{"k":"sc","q":"Zeyd b. Sâbit ve diğer sahabe Kur'an'ı zaten ezberlemişken neden başkalarının şahitliğine başvuruldu?","x":"Mushaf ümmetin ortak kabulüne mazhar olsun, toplumsal mutabakat sağlansın diye iki şahit istenmişti. Hiç kimse \"Bende de yazılı metin ve ezber vardı, bana neden başvurulmadı; bendekiler mushafta eksik kalmış olabilir mi?\" diye kaygılanmasın diye…"},{"k":"h","x":"Cem' edilen Mushaf'ın özellikleri"},{"k":"li","x":"Derleme en sağlam ilmî usullerle yapılmıştır."},{"k":"li","x":"Tilaveti mensuh ayetler metne alınmamıştır."},{"k":"li","x":"Nüshadaki ayetlerin tevatürle intikal ettiğinde ümmetin icmaı vardır."},{"k":"li","x":"Derlenen Mushaf **yedi harfi içermektedir.**"},{"k":"li","x":"Bu Kur'an'a **Abdullah b. Mes'ûd**'un teklifiyle \"**Mushaf**\" ismi verilmiştir."},{"k":"li","x":"Bu nüsha resmiyet kazanmıştır: Hz. Ebû Bekir'den Hz. Ömer'e, ondan **Hz. Hafsa**'ya teslim edilmiş ve Hz. Osman'a ulaşmıştır."}]},{"h":"C. Hz. Osman zamanında cem' (istinsah)","b":[{"k":"li","x":"İslam fetihleri genişlemiş, kurrâ büyük şehirlere dağılmıştı. Her şehrin halkı kıraati kendilerine gelen kimseden almıştı; bu yüzden farklı okuyorlardı."},{"k":"li","x":"**Ermenistan ve Azerbaycan fetihleri** sırasında Iraklılar ile Şamlılar arasında kıraat ihtilafı çıktı: Iraklılar **İbn Mes'ûd**'dan, Şamlılar **Übey b. Ka'b**'dan öğrendikleri gibi okuyor, her biri kendi kıraatinin daha sahih olduğunu iddia ediyordu. Savaşa katılan **Huzeyfe el-Yemânî** gördüklerini Hz. Osman'a anlattı."},{"k":"ar","a":"أَدْرِكِ الْأُمَّةَ قَبْلَ أَنْ يَخْتَلِفُوا اخْتِلَافَ الْيَهُودِ وَالنَّصَارَى","x":"Huzeyfe: \"Yahudi ve Hristiyanlar gibi ihtilafa düşmeden bu ümmete yetiş!\""},{"k":"li","x":"Hz. Osman Hafsa'dan sahifeleri istedi; **Zeyd b. Sâbit, Abdullah b. Zübeyr, Saîd b. Âs ve Abdurrahman b. Hâris b. Hişâm**'a çoğaltmalarını emretti. Kureyşli üç kişiye: \"Zeyd ile bir şeyde ihtilaf ederseniz onu Kureyş lehçesiyle yazın; çünkü Kur'an onların diliyle indi\" dedi. Çoğaltılan mushaflar her bölgeye gönderildi, bunların dışındaki sahife ve mushafların yakılması emredildi."},{"k":"li","x":"Sahabe, Ebû Bekir'in cem ettiği ilk Mushaf'ı istinsah etmek ve insanları bir harf üzerinde sabit olan kıraatte birleştirmek hususunda anlaştı."},{"k":"h","x":"Çoğaltmada esas alınan prensipler"},{"k":"n","n":1,"x":"Hz. Ebû Bekir'in derlediği Mushaf esas alınacaktır."},{"k":"n","n":2,"x":"Son arzada kesinleşmiş okuma tarzı yazılacak; Hz. Peygamber'in son arzada okuduğu **bir harf** alınıp **altı harf terk edilecektir.**"},{"k":"n","n":3,"x":"Tilaveti neshedilmiş ayetler kaydedilmeyecektir."},{"k":"n","n":4,"x":"Komisyonda lehçe ihtilafı çıkarsa **Kureyş lehçesi** esas alınacaktır."},{"k":"n","n":5,"x":"Farklı tertipte mushaflar vardı; Hz. Osman surelerin yeni bir tertibe tabi tutulmasını emretti."},{"k":"n","n":6,"x":"Tefsir ve açıklama amacıyla kaydedilen özel notlar bu mushaflara yazılmayacaktır."},{"k":"ornek","x":"**Hz. Âişe'nin şahsi nüshasında** Bakara 238: «حَافِظُوا عَلَى الصَّلَوَاتِ وَالصَّلَاةِ الْوُسْطَى صَلَاةِ الْعَصْرِ». **İbn Abbas'ın şahsi nüshasında** Bakara 198: «لَيْسَ عَلَيْكُمْ جُنَاحٌ أَنْ تَبْتَغُوا فَضْلًا مِنْ رَبِّكُمْ فِي مَوَاسِمِ الْحَجِّ». Önceleri hususi nüshalarda yazılı bu kolaylaştırıcı eklemeler yaygınlaştı; \"falancanın kıraati şöyleydi\" sözleri tefrikaya yol açtı. Hz. Huzeyfe böylece doğabilecek bir tehlikenin önüne geçmiş oldu."},{"k":"li","x":"Zeyd: Mushafı çoğaltırken Ahzâb'dan Resûlullah'ın okuduğunu işittiğim bir ayeti bulamadım; aradık, Huzeyme b. Sâbit el-Ensârî'de bulduk: «مِنَ الْمُؤْمِنِينَ رِجَالٌ صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ» ve suresine ekledik."},{"k":"h","x":"Çoğaltma esnasında yapılan faaliyetler"},{"k":"li","x":"Zeyd b. Sâbit başkanlığındaki istinsah heyeti bu görevi **5 yılda** tamamladı."},{"k":"li","x":"Çoğaltılan nüshaların sayısında ihtilaf vardır; genel kanaat **6 veya 7**'dir."},{"k":"li","x":"Mushaflar **Kûfe, Basra, Şam, Mekke, Bahreyn ve Yemen**'e gönderildi; bir adedi Medine'de bırakıldı ve buna \"**el-Mushafü'l-İmâm**\" adı verildi."},{"k":"li","x":"Her mushafla birlikte o beldenin insanlarına kıraati öğretecek Kur'an muallimleri de gönderildi. Böylece hem kıraatte hem kitâbette birlik sağlandı."},{"k":"h","x":"Hz. Ebû Bekir'in cem'i ile Hz. Osman'ın cem'i arasındaki fark"},{"k":"tbl","r":[["","Hz. Ebû Bekir","Hz. Osman"],["Sebep","Hâfızların ölümüyle Kur'an'ın kaybolması korkusu","Kıraat vecihlerinde ihtilafın çoğalması"],["Yapılan","Dağınık yazılı sure ve ayetleri tek mushafta, sıralı olarak toplamak","Mushafı yedi harften bir harf üzerinde çoğaltmak"],["Yedi harf","Yedi harfi içine alır","Bir harf; diğer altısı bırakılır"],["Lehçe","","Kureyş lehçesi"],["Sonuç","Tilaveti neshedilmemiş olanla yetinen ilk resmî Mushaf","Müslümanları bir mushaf ve bir lehçe üzerinde birleştirmek"]]}]},{"h":"Kur'an'a hareke ve nokta konulması","b":[{"k":"li","x":"İslam'dan önce Arap yazısı basit ve iptidaiydi; nokta ve hareke yoktu. Arap olmayanların Müslüman olmasıyla Kur'an'ın okunuşunda hatalar sıklaştı; sebebi yazıda nokta ve harekenin olmayışıydı."},{"k":"ornek","x":"Osman b. Ebî Şeybe Fil suresindeki «أَلَمْ» edatını hurûf-ı mukattaa gibi \"Elif-Lâm-Mîm\" diye okudu. Hamza ez-Zeyyât «لَا رَيْبَ فِيهِ» ayetini «لَا زَيْتَ فِيهِ» diye okudu."},{"k":"h","x":"Harekeleme"},{"k":"steps","x":["**Teklif:** Basra valisi **Ziyâd b. Sümeyye** (ö. 53/673), **Ebü'l-Esved ed-Düelî**'den (ö. 69/688) Arap dilinin ıslahı için bir usul koymasını istedi; Düelî başta reddetti.","**Olay:** Ziyâd bir adamı Düelî'nin yoluna oturtup bir ayeti yanlış okumasını tembihledi. Adam «أَنَّ اللَّهَ بَرِيءٌ مِنَ الْمُشْرِكِينَ وَرَسُولُهُ» ayetinde «رَسُولُهُ» kelimesini **kesreli** okudu (anlam: \"Allah müşriklerden ve Resûlü'nden uzaktır\" olur).","**Kabul:** Düelî valiye gidip teklifi kabul etti; valinin gönderdiği 30 kadar kâtipten birini seçti.","**Yöntem:** \"Mushafı bir eline, farklı renkte boyayı diğerine al. Fetha okuyunca harfin üstüne, kesre okuyunca altına, ötre okuyunca önüne bir nokta koy; tenvin (gunne) yaparsam iki nokta koy.\""]},{"k":"not","x":"Hareke yerine kullanılan nokta işine **kelime sonlarından** başlandı, çünkü problem kelime sonunda oluyordu. Bu noktalar hareke içindir; bugün harfleri birbirinden ayıran noktalardan farklıdır."},{"k":"h","x":"Noktalama (i'câm)"},{"k":"li","x":"Hareke problemi tamamen çözmedi; Arap olmayanların benzer harfleri (be, te, se gibi) yanlış okuma tehlikesi sürüyordu."},{"k":"li","x":"Irak valisi **Haccâc b. Yûsuf**, **Nasr b. Âsım**'dan (bir rivayete göre **Yahyâ b. Ya'mer**'den) tedbir almasını istedi. Böylece **i'câm** denilen noktalama işi yapıldı."},{"k":"h","x":"Sonraki aşamalar"},{"k":"tbl","r":[["Faaliyet","Kim"],["Bugünkü tarzda harekeleme","**Halîl b. Ahmed** (ö. 175/791)"],["Manayı dikkate alan durak işaretleri","**Muhammed b. Tayfûr es-Secâvendî** (ö. 560), hicri 6. asır"]]},{"k":"h","x":"Hareke ve nokta karşılaştırması"},{"k":"tbl","r":[["","Hareke (nokta ile)","Nokta (i'câm)"],["Kim","Ebü'l-Esved ed-Düelî","Nasr b. Âsım / Yahyâ b. Ya'mer"],["Talep eden","Ziyâd b. Sümeyye (Basra)","Haccâc b. Yûsuf (Irak)"],["Amaç","İ'rab hatasını önlemek","Benzer harfleri ayırmak"]]}]}],"ht":[{"s":0,"x":"Cem': hıfz ve kitâbet. Cem-i evvel (Hz. Peygamber), cem-i sânî (Ebû Bekir), cem-i sâlis (Osman, istinsah)."},{"s":1,"x":"Yedi hâfız: İbn Mes'ûd, Sâlim, Muâz, Übey, Zeyd b. Sâbit, Ebû Zeyd, Ebü'd-Derdâ (sayı Peygamber'e arz edenleri gösterir; Bi'r-i Maûne'de 70 hâfız şehit oldu)."},{"s":1,"x":"Tek mushafta toplanmama sebepleri: vahyin güvencesi hayatta · son ayetle vefat arası kısa (9 gün) · vahiy devam ediyordu · nesih ihtimali · yazılış sırası iniş sırasına göre değil."},{"s":2,"x":"Ebû Bekir dönemi: sebep Yemâme'de kurrânın şehadeti; teklif Hz. Ömer'den; görevli Zeyd b. Sâbit (arza-i ahîrede bulunmuş, genç, güvenilir)."},{"s":2,"x":"Huzeyme (züşşehâdeteyn): Tevbe'nin son iki ayeti ve Ahzâb 23 yalnız onda yazılı bulundu. \"Mushaf\" adı İbn Mes'ûd'un teklifi; nüsha Hafsa'da kaldı."},{"s":3,"x":"Osman dönemi: sebep Ermenistan–Azerbaycan'da Irak (İbn Mes'ûd) ile Şam (Übey) arasında kıraat ihtilafı; haber veren Huzeyfe."},{"s":3,"x":"Heyet: Zeyd b. Sâbit (başkan), Abdullah b. Zübeyr, Saîd b. Âs, Abdurrahman b. Hâris. 5 yıl; 6–7 nüsha; Medine'deki el-Mushafü'l-İmâm."},{"s":3,"x":"Fark: Ebû Bekir kaybolma korkusuyla yedi harfi içeren tek mushaf; Osman ihtilaf yüzünden bir harf ve Kureyş lehçesi üzerine çoğaltma."},{"s":4,"x":"Hareke: Ziyâd'ın talebiyle Ebü'l-Esved ed-Düelî (renkli noktalarla). Nokta (i'câm): Haccâc'ın talebiyle Nasr b. Âsım / Yahyâ b. Ya'mer. Bugünkü hareke: Halîl b. Ahmed. Duraklar: Secâvendî."}]},{"t":"Âyet ve Sûrelerin Tertibi","intro":"Ayetlerin ve surelerin sıralanışı hakkındaki görüşler, sure ve ayet sayıları, uzunluklarına göre sureler, Resm-i Osmânî ve fâsılalar.","s":[{"h":"Âyetlerin tertibi","b":[{"k":"li","x":"**Sözlükte âyet:** Herhangi bir şeyin varlığını gösteren alamet, işaret, delil, ibret, mucize gibi anlamlara gelir. Çoğulu **ây** veya **âyât**'tır."},{"k":"d","t":"Âyet","x":"Kur'an'ın sureleri içinde bulunan, Allah'ın kelamından bir söz dizisidir."},{"k":"li","x":"**Zerkeşî, Ebû Ca'fer İbnü'z-Zübeyr ve Süyûtî** gibi âlimler ayetlerin tertibinin **tevkîfî** olduğunda icma bulunduğunu söylemişlerdir."},{"k":"ar","a":"وَحَكَى بَعْضُهُمُ الْإِجْمَاعَ عَلَى ذَلِكَ، مِنْهُمُ الزَّرْكَشِيُّ فِي الْبُرْهَانِ، وَأَبُو جَعْفَرِ بْنُ الزُّبَيْرِ فِي مُنَاسَبَاتِهِ إِذْ يَقُولُ: تَرْتِيبُ الْآيَاتِ فِي سُوَرِهَا وَاقِعٌ بِتَوْقِيفِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَأَمْرِهِ مِنْ غَيْرِ خِلَافٍ بَيْنَ الْمُسْلِمِينَ، وَجَزَمَ السُّيُوطِيُّ بِذَلِكَ فَقَالَ: الْإِجْمَاعُ وَالنُّصُوصُ الْمُتَرَادِفَةُ عَلَى أَنَّ تَرْتِيبَ الْآيَاتِ تَوْقِيفِيٌّ لَا شُبْهَةَ فِي ذَلِكَ","x":"Ayetlerin surelerindeki sıralanışı Hz. Peygamber'in tevkîfi ve emriyledir; Müslümanlar arasında bunda ihtilaf yoktur."},{"k":"ornek","x":"**Osman b. Ebi'l-Âs:** Resûlullah'ın yanındaydım; birden gözü bir noktaya sabitlendi, sonra normale döndü ve \"Cebrâil bana geldi ve «إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ وَإِيتَاءِ ذِي الْقُرْبَى» ayetini şu surenin şu yerine koymamı emretti\" buyurdu."},{"k":"li","x":"Halife Hz. Osman Kur'an'ı toplarken tüm ayetleri vahiydeki yerlerine göre sıralamış, hükmü kaldırılmış ayetleri bile metinden çıkarmamıştır."}]},{"h":"Sûrelerin tertibi","b":[{"k":"li","x":"Âlimler surelerin sıralanışı konusunda ihtilaf etmişlerdir:"},{"k":"ar","a":"اخْتَلَفَ الْعُلَمَاءُ فِي تَرْتِيبِ السُّوَرِ: أ- فَقِيلَ: إِنَّهُ تَوْقِيفِيٌّ تَوَلَّاهُ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَمَا أَخْبَرَ بِهِ جِبْرِيلُ عَنْ أَمْرِ رَبِّهِ. ب- وَقِيلَ: إِنَّ تَرْتِيبَ السُّوَرِ بِاجْتِهَادٍ مِنَ الصَّحَابَةِ بِدَلِيلِ اخْتِلَافِ مَصَاحِفِهِمْ فِي التَّرْتِيبِ. ج- وَقِيلَ: إِنَّ بَعْضَ السُّوَرِ تَرْتِيبُهُ تَوْقِيفِيٌّ وَبَعْضُهَا بِاجْتِهَادِ الصَّحَابَةِ","x":""},{"k":"h","x":"Tevkîfîdir"},{"k":"li","x":"Peygamber Efendimiz, Cebrâil'in kendisine haber verdiği gibi sureleri bu şekilde sıralamıştır. Ayetler bu tertip üzere indiği gibi sureler de bu tertip üzere dizilmiştir."},{"k":"li","x":"Hz. Osman'ın Mushafındaki sıralama budur; bu tertip üzerinde hiçbir sahabeden ihtilaf nakledilmemiştir. Bu, onların sıralamada ittifak ettiğini gösterir."},{"k":"li","x":"Zeyd b. Sâbit, **son arzada** Hz. Peygamber'den duyduğu şekilde tertip etmiştir."},{"k":"h","x":"İctihâdîdir (ve eleştirisi)"},{"k":"li","x":"Sahabenin mushaflarının tertibi farklıydı:"},{"k":"tbl","r":[["Mushaf","Tertip"],["**Hz. Ali**","Nüzul sırasına göre: İkra' → Müddessir → Kalem → Müzzemmil…"],["**İbn Mes'ûd**","Bakara → Nisâ → Âl-i İmrân…"],["**Übey b. Ka'b**","Fâtiha → Bakara → Nisâ → Âl-i İmrân…"]]},{"k":"dikkat","x":"**Eleştirisi:** Bu görüş dayanılacak bir delile dayanmaz. Bazı sahabenin kendi özel mushaflarını tertip etmesi, Kur'an tertipli olarak cem edilmeden önce kendi tercihiydi. Hz. Osman döneminde ayet ve sureler sıralı olarak bir harf üzerinde cem edilip ümmet bunda ittifak edince kendi mushaflarını bıraktılar. Tertip ictihâdî olsaydı kendi mushaflarına sarılırlardı."},{"k":"h","x":"Kısmen tevkîfî, kısmen ictihâdîdir (ve eleştirisi)"},{"k":"li","x":"Bazı surelerin sıralamasının nübüvvet döneminde yapıldığına işaret eden rivayetler vardır: **es-Seb'u't-Tıvâl** (yedi uzun sure), **el-Havâmîm** ve **el-Mufassal** surelerinin Peygamber Efendimizin hayatında sıralandığına dair rivayetler mevcuttur."},{"k":"li","x":"Resûlullah'ın \"**Zehrâveyn'i okuyun: Bakara ve Âl-i İmrân**\" buyurduğu rivayet edilmiştir."},{"k":"li","x":"Hz. Peygamber'in yatağına çekildiğinde sırasıyla **İhlâs, Felak ve Nâs** surelerini okuyup vücuduna üflediği rivayet edilir."},{"k":"li","x":"**İbn Hacer:** Bu, surelerin şu anki Mushaftaki sıralamasının Resûlullah zamanındaki sıralamaya uygun olduğunu gösterir."},{"k":"dikkat","x":"**Eleştirisi:** Bu görüşün delilleri tevkîfî olanı gösteren nasları zikretmeye dayanır. İctihâdî denilen kısım ise tertibinin ictihâdî olduğunu gösteren bir delile dayanmaz. Tevkîfî olanın delilleriyle sabit olması, geri kalanının ictihâdî olduğu anlamına gelmez. Üstelik bu kısım çok azdır."},{"k":"h","x":"Netice"},{"k":"ar","a":"وَبِهَذَا يَتَرَجَّحُ أَنَّ تَرْتِيبَ السُّوَرِ تَوْقِيفِيٌّ كَتَرْتِيبِ الْآيَاتِ","x":"Böylece surelerin tertibinin de ayetlerin tertibi gibi tevkîfî olduğu tercih edilir."},{"k":"li","x":"**Ebû Bekir İbnü'l-Enbârî:** Allah Kur'an'ın tamamını dünya semasına indirdi, sonra yirmi küsur yılda parça parça indirdi. Sure bir olay üzerine, ayet bir soruya cevap olarak inerdi; Cebrâil Hz. Peygamber'e ayet ve surenin yerini bildirirdi. Surelerin dizilişi de ayet ve harflerin dizilişi gibi Hz. Peygamber'dendir; bir sureyi öne alan veya geriye bırakan Kur'an'ın nazmını bozmuş olur."},{"k":"li","x":"**Kirmânî (el-Burhân):** Surelerin tertibi Allah katında Levh-i Mahfûz'da bu şekildedir. Hz. Peygamber her yıl o zamana kadar inenleri Cebrâil'e arz ederdi; vefat ettiği yıl iki defa arz etti."},{"k":"tbl","r":[["Görüş","Dayanak","Değerlendirme"],["**Tevkîfî**","Cebrâil'in bildirmesi; Osman Mushafındaki tertipte ihtilaf olmaması; son arza","**Tercih edilen görüş**"],["**İctihâdî**","Ali, İbn Mes'ûd ve Übey mushaflarının farklı tertibi","Delile dayanmaz; özel mushaflar cem'den önceki tercihtir"],["**Kısmen tevkîfî, kısmen ictihâdî**","Seb'u't-Tıvâl, Havâmîm, Mufassal, Zehrâveyn rivayetleri","İctihâdî kısım için delil yoktur; o kısım çok azdır"]]}]},{"h":"Sûrelerin sayısı ve uzunluklarına göre sûreler (Tıvel vb.)","b":[{"k":"tbl","r":[["Konu","Bilgi"],["Sure sayısı","**114** (Enfâl ve Tevbe'yi tek sure sayıp 113 diyen de vardır)"],["Ayet sayısı","**6200**; fazlası hakkında âlimler ihtilaf etmiştir"],["En uzun ayet","**Müdâyene ayeti** (Bakara 2/282)"],["En uzun sure","**Bakara**"]]},{"k":"h","x":"Uzunluklarına göre sureler"},{"k":"tbl","r":[["Grup","Tanım"],["**1. Tıvel**","Fâtiha'dan sonraki 7 uzun sure; ayetleri yüzden fazladır: Bakara, Âl-i İmrân, Nisâ, Mâide, En'âm, A'râf, Tevbe."],["**2. Mi'ûn**","Ayetleri yüzden fazla veya yüze yakın sureler."],["**3. Mesânî**","Ayet sayısı yüzden az olan sureler."],["**4. Mufassal**","Kısa ve besmeleli fasılaların çok olduğu sureler. Kâf veya Hucurât ile başladığı hususunda ihtilaf vardır."]]},{"k":"h","x":"Mufassalın kısımları"},{"k":"tbl","r":[["Kısım","Aralık"],["**Tıvâl-ı mufassal**","Kâf veya Hucurât ile Nebe' veya Bürûc arası"],["**Evsât-ı mufassal**","Nebe' veya Bürûc ile Duhâ veya Beyyine arası"],["**Kısâr-ı mufassal**","Duhâ veya Beyyine ile Nâs arası"]]}]},{"h":"Resm-i Osmânî ve bu konudaki görüşler","b":[{"k":"d","t":"Resm-i Osmânî","x":"Zeyd b. Sâbit ve beraberindeki üç Kureyşlinin, Hz. Osman'ın uygun gördüğü özel yazı metoduyla yazdıkları Mushafın imlası; âlimler bu usule Hz. Osman'a nispetle bu adı vermişlerdir."},{"k":"tbl","r":[["Görüş","İçerik","Destekleyenler"],["**1. Tevkîfîdir**","Resm-i Osmânî ile yazılması tevkîfîdir; Kur'an yazılırken ona uyulması gerekir. Bu görüştekiler onu takdiste aşırı gitmişlerdir.","Hz. Peygamber'in kâtibi Muâviye'ye harflerin biçimine dikkat etmesini, \"Allah\", \"Rahmân\", \"Rahîm\" lafızlarını güzel yazmasını, kalemi sol kulağının üzerine koymasını tavsiye ettiği rivayeti. İbnü'l-Mübârek, şeyhi Abdülazîz ed-Debbâğ'dan: Sahabenin veya başkalarının imlaya en küçük müdahalesi yoktur; tamamen Hz. Peygamber'in vahye dayalı emriyle şekillenmiştir."],["**2. Tevkîfî değildir, ama muhalefet caiz değildir**","Hz. Osman'ın seçip beğendiği bir ıstılahtır; ümmet kabul edip benimsediği için ona muhalefet caiz değildir. **Âlimlerin çoğunun görüşü.**","Eşheb'in aktardığına göre İmam Mâlik: Kur'an sadece ilk yazıldığı imla ile yazılır; mushaftaki vav, elif gibi harflerin değiştirilmesi de caiz değildir. Ebû Amr ed-Dânî bunu nakledip âlimler arasında ihtilaf olmadığını belirtir."],["**3. Istılâhîdir, muhalefete engel yoktur**","İnsanlar imla için özel bir yazıda ittifak etmiş ve bu yayılmıştır.","Kadı Ebû Bekir el-Bâkıllânî (el-İntisâr): Allah ümmete belirli bir yazı şekli farz kılmamıştır; vacip olsaydı Resûlullah'tan işitilen bir rivayetle bilinirdi. Kur'an'da ve sünnette bağlayıcı hüküm yoktur; sahabe yazımda farklı tercihler kullanmıştır."]]}]},{"h":"Fâsılalar ve âyet başları; fâsıla çeşitleri","b":[{"k":"tbl","r":[["Kavram","Tanım"],["**Fâsıla**","Bir sözün kendisinden sonrakinden ayrıldığı yer; bazen ayet başı olur, bazen olmaz."],["**Ayet başı**","Bir ayetin bittiği yer."],["**Seci'**","Sözlerin belirli bir vezne göre art arda gelmesi."]]},{"k":"not","x":"Âlimlere göre **her ayet başı bir fâsıladır, fakat her fâsıla ayet başı değildir.**"},{"k":"dikkat","x":"Bazıları Kur'an'da seci' bulunduğunu iddia etse de **Kadı Ebû Bekir el-Bâkıllânî** ve birçok âlim buna karşı çıkar: Kur'an'ın üslubu ediplerin ve kâhinlerin sözünden yüksektir ve seci' yapmak amacıyla söylenmemiştir. Kur'an'daki uyumlu ifadelere seci' değil **fâsıla** denir; böylece Kur'an'a manadan bağımsız seci' isnad edilmemiş olur."},{"k":"h","x":"Kur'an-ı Kerîm'deki fâsıla çeşitleri"},{"k":"tbl","r":[["Çeşit","Açıklama","Örnek"],["**1. Birbirine benzeyen**","Ayet sonları hem lafız hem ses olarak benzer","«وَالطُّورِ، وَكِتَابٍ مَسْطُورٍ، فِي رَقٍّ مَنْشُورٍ، وَالْبَيْتِ الْمَعْمُورِ»"],["**2. Harfleri birbirine yakın**","Ayet sonundaki harfler şekil veya ses bakımından yakın","«الرَّحْمَنِ الرَّحِيمِ، مَالِكِ يَوْمِ الدِّينِ»"],["**3. Mütevâzî**","Hem vezin hem seci' yönünden uyum","«فِيهَا سُرُرٌ مَرْفُوعَةٌ، وَأَكْوَابٌ مَوْضُوعَةٌ»"],["**4. Mütevâzin**","Sadece vezin dikkate alınır, seci' uyumu aranmaz","«وَنَمَارِقُ مَصْفُوفَةٌ، وَزَرَابِيُّ مَبْثُوثَةٌ»"],["**5. Harf ziyadesi**","Vezin veya seci' için harf eklenir","«وَتَظُنُّونَ بِاللَّهِ الظُّنُونَا»: \"elif\" fazladan eklenmiştir"],["**6. Harf hazfi**","Son kısımda bir harf düşürülür","«وَاللَّيْلِ إِذَا يَسْرِ»: \"yâ\" harfi hazfedilmiştir"],["**7. Belâgî sebeple kelime dizilimi**","Anlam ve etki gücü için dizilim değişir","«فَأَوْجَسَ فِي نَفْسِهِ خِيفَةً مُوسَى»: fail \"Mûsâ\" başta gelmeliyken sona bırakılmıştır"]]}]}],"ht":[{"s":0,"x":"Ayetlerin tertibi icma ile tevkîfîdir (Zerkeşî, İbnü'z-Zübeyr, Süyûtî); delil: Osman b. Ebi'l-Âs rivayeti (Nahl 90)."},{"s":1,"x":"Surelerin tertibi: tevkîfî (tercih edilen), ictihâdî (sahabe mushafları farklı), kısmen tevkîfî kısmen ictihâdî. Netice: ayetler gibi sureler de tevkîfîdir."},{"s":2,"x":"114 sure, 6200 ayet; en uzun ayet müdâyene, en uzun sure Bakara."},{"s":2,"x":"Uzunluğa göre: Tıvel (7 uzun sure) · Mi'ûn (yüz civarı) · Mesânî (yüzden az) · Mufassal (tıvâl, evsât, kısâr)."},{"s":3,"x":"Resm-i Osmânî: tevkîfî (Debbâğ) · ıstılâhî ama muhalefet caiz değil (çoğunluk, İmam Mâlik, Dânî) · ıstılâhî ve muhalefet caiz (Bâkıllânî)."},{"s":4,"x":"Her ayet başı fâsıladır, her fâsıla ayet başı değildir. Kur'an'daki uyuma seci' değil fâsıla denir (Bâkıllânî)."},{"s":4,"x":"Fâsıla çeşitleri: benzeyen · harfleri yakın · mütevâzî (vezin + seci') · mütevâzin (sadece vezin) · harf ziyadesi (ez-zunûnâ) · harf hazfi (yesr) · belâgî dizilim (hîfeten Mûsâ)."}]},{"t":"Yedi Harf Meselesi","intro":"Yedi harfle ilgili hadisler, \"seb'a\" lafzının delaleti, zayıf ve kuvvetli görüşler, Muhsin Demirci'nin değerlendirmesi ve Şîa'nın yaklaşımı.","s":[{"h":"Yedi harfle ilgili hadisler (Hz. Ömer–Hişâm b. Hakîm olayı vb.)","b":[{"k":"ar","a":"إِنَّ رَبِّي أَرْسَلَ إِلَيَّ أَنْ أَقْرَأَ الْقُرْآنَ عَلَى حَرْفٍ، فَرَدَدْتُ إِلَيْهِ: أَنْ هَوِّنْ عَلَى أُمَّتِي، فَأَرْسَلَ إِلَيَّ: أَنْ أَقْرَأَهُ عَلَى حَرْفَيْنِ، فَرَدَدْتُ إِلَيْهِ: أَنْ هَوِّنْ عَلَى أُمَّتِي، فَأَرْسَلَ إِلَيَّ: أَنِ اقْرَأْهُ عَلَى سَبْعَةِ أَحْرُفٍ","x":"Rabbim Kur'an'ı bir harf üzere okumamı bildirdi; \"ümmetime kolaylaştır\" dedim, iki harf dedi; yine dedim, yedi harf üzere okumamı bildirdi."},{"k":"ar","a":"إِنَّ هَذَا الْقُرْآنَ أُنْزِلَ عَلَى سَبْعَةِ أَحْرُفٍ فَاقْرَءُوا مَا تَيَسَّرَ مِنْهُ","x":"Bu Kur'an yedi harf üzere indirildi; kolayınıza geleni okuyun."},{"k":"ar","a":"إِنَّ الْقُرْآنَ أُنْزِلَ عَلَى سَبْعَةِ أَحْرُفٍ كُلُّهَا شَافٍ كَافٍ","x":"Kur'an yedi harf üzere indirildi; hepsi şifa verici ve yeterlidir."},{"k":"h","x":"Hz. Ömer–Hişâm b. Hakîm olayı"},{"k":"steps","x":["Hz. Ömer, Resûlullah hayattayken **Hişâm b. Hakîm**'in namazda **Furkân suresini** kendisine okutulandan farklı okuduğunu işitti. Az kalsın üzerine atılacaktı; selam verinceye kadar sabretti.","\"Bu sureyi sana kim okuttu?\" diye sordu. Hişâm \"Resûlullah okuttu\" dedi. Ömer \"Yalan söylüyorsun\" deyip yakasından tutarak onu Resûlullah'a götürdü.","Resûlullah \"Hişâm'ın yakasını bırak\" dedi; Hişâm'a okuttu ve \"**Bu sure böyle indirildi**\" buyurdu.","Sonra Ömer'e okuttu ve \"**Bu sure böyle de indirildi. Kur'an yedi harf üzerine indirildi; hangisi kolayınıza gelirse onu okuyun**\" buyurdu."]},{"k":"h","x":"Hz. Peygamber'in Hz. Ömer'e sözü"},{"k":"ar","a":"إِنَّ الْقُرْآنَ كُلَّهُ صَوَابٌ مَا لَمْ تَجْعَلْ مَغْفِرَةً عَذَابًا أَوْ عَذَابًا مَغْفِرَةً","x":"Ebû Talha'nın bildirdiğine göre Hz. Ömer ile bir şahıs arasında kıraat ihtilafı çıktı; Resûlullah ikisinin okuyuşunu da beğenip \"Ey Ömer! Rahmet ayetini azap, azap ayetini rahmet kılmadıkça kıraatlerin hepsi doğrudur\" buyurdu."},{"k":"h","x":"Hadislerin sayısı"},{"k":"li","x":"**Abdussabûr Şâhin**'e göre bu konudaki hadisler **46** olup **34**'ü tenkit edilemeyecek kadar sahihtir. Hadislerin çoğu güvenilir hadis kaynaklarındadır."},{"k":"li","x":"Hemen her hadiste geçen \"Kur'an 7 harf üzere nazil olmuştur; hangisi kolayınıza gelirse onu okuyun\" sözü **manevi tevatür** derecesine çıkmıştır."},{"k":"dikkat","x":"Yedi harfle ilgili hadislerde konunun **mahiyetini açıklayan bilginin bulunmayışı**, ihtilafların doğmasına sebep olmuştur."}]},{"h":"\"Seb'a\" (yedi) lafzının delâleti","b":[{"k":"tbl","r":[["Görüş","Açıklama"],["**1. Hakiki anlamdadır**","Yedi rakamına delalet eder."],["**2. Mecazi anlamdadır**","Kesretten (çokluktan) kinayedir; genişlik ve kolaylık anlamındadır: Kur'an'ın çok sayıda farklı kelimeyle okunmaya uygun oluşu."]]},{"k":"not","x":"**Kesretten kinaye olması fikri ağır basmaktadır.**"}]},{"h":"Yedi harfle ilgili zayıf görüşler","b":[{"k":"tbl","r":[["#","Yedi harf şudur"],["1","Nâsih-mensûh; umum-husus; mücmel-mübeyyen ve müfesser"],["2","Emir-nehiy; talep, dua, haber, istihbâr ve zecr"],["3","Va'd-va'îd; mutlak-mukayyed; tefsir-te'vil ve i'rab"],["4","Helal-haram; muhkem-müteşâbih; inşâ ve ihbâr"],["5","Mukaddem-muahhar; ferâiz, hudûd, mevâiz, müteşâbih ve emsâl"],["6","Mutlak-mukayyed; umum-husus; nass-müevvel; nâsih-mensûh; mücmel-müfesser ve istisnâ"],["7","Meşhur yedi imamın kıraati"],["8","Ebû Bekir, Ömer, Osman, Ali, İbn Mes'ûd, İbn Abbas ve Übey b. Ka'b'ın kıraatleri"]]},{"k":"dikkat","x":"**İsmail Cerrahoğlu:** Kanımca yedi kıraat ile yedi harf ayrı ayrı şeylerdir."}]},{"h":"Yedi harfle ilgili kuvvetli görüşler","b":[{"k":"h","x":"1. Görüş: Yedi Arap kabilesinin lehçesi"},{"k":"li","x":"Yedi harf, Arap kabilelerinden yedisinin kullandığı **lehçe ve lügattir.**"},{"k":"li","x":"**Kimin görüşü:** Ebû Ubeyd Kâsım b. Sellâm, Ebû Hâtim es-Sicistânî, İbn Atıyye ve el-Beyhakî."},{"k":"ornek","x":"«حَتَّى» kelimesinin «عَتَّى», «أَعْطَيْتُ» kelimesinin «أَنْطَيْتُ» şeklinde telaffuz edilmesi."},{"k":"dikkat","x":"**Eleştiri:** Bu görüş sahipleri söz konusu kabilelerin isimlerini zikretmemişlerdir. Ayrıca Hz. Ömer ile Hişâm b. Hakîm arasında farklı okumadan bir ihtilaf yaşanmıştı; hâlbuki ikisi de Kureyş kabilesindendi. Bu görüş kabul edilirse o olayla çelişir."},{"k":"h","x":"2. Görüş: Yedi vecih (tarz)"},{"k":"li","x":"Yedi harfle kastedilen **yedi vecihtir.** Bu yedinin tespiti için belli bir tarz oluşturulmaya çalışılmış, ancak görüş birliğine varılamamıştır."},{"k":"li","x":"Örnek olarak **İbn Kuteybe**'nin **Te'vîlü Müşkili'l-Kur'ân**'da zikrettiği yedi veçhe bakılabilir:"},{"k":"tbl","r":[["#","Vecih","Örnek"],["1","**Harekesi değişen, manası ve sureti değişmeyen** «اخْتِلَافُ الْإِعْرَابِ مَعَ بَقَاءِ الصُّورَةِ وَالْمَعْنَى»","«هُنَّ أَطْهَرُ لَكُمْ» → «أَطْهَرَ» (Hûd 11/78) · «وَهَلْ نُجَازِي إِلَّا الْكَفُورَ» → «وَهَلْ يُجَازَى إِلَّا الْكَفُورُ» (Sebe' 34/17) · «بِالْبُخْلِ» → «بِالْبَخَلِ» (Nisâ 4/37) · «مَيْسَرَةٍ» → «مَيْسُرَةٍ» (Bakara 2/280)"],["2","**Harekesi ve manası değişen, sureti değişmeyen** «اخْتِلَافُ الْإِعْرَابِ بِتَغْيِيرِ الْمَعْنَى دُونَ الصُّورَةِ»","«فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِمَاتٍ»
