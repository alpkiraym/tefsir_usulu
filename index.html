ı okuyuşları izah edemeyiz."},{"k":"li","x":"Günümüzdeki **yedi kıraat de bu tek harfe dahildir.** «فَاسْعَوْا إِلَى ذِكْرِ اللَّهِ» artık «فَامْضُوا» olarak okunmaz. «فَاسْعَوْا» üzerindeki kıraat konusu konuşulabilir; ama bu manayı ifade edecek farklı bir lafız aramaya girişmeyiz. Bu o döneme has bir ruhsattı."},{"k":"h","x":"Kıraat ile yedi harf farkı"},{"k":"tbl","r":[["Kıraat","Yedi harf"],["Aynı kelime üzerinde med, kasr, hareke, sükûn, nokta, i'rab gibi hususlardaki değişiklikler","Kelimelerin yapısındaki değişiklikler"]]}]},{"h":"Şîa'nın yaklaşımı","b":[{"k":"li","x":"Şîa'ya göre Ehl-i Sünnet'in bu meseledeki bütün sözleri yalandır; Kur'an **tek bir harf** üzere nazil olmuştur. Ehl-i Sünnet âlimlerinin ileri sürdüğü deliller Kur'an'ın yedi harf üzere indiğini göstermez."},{"k":"li","x":"**Zürâre**, Ebû Ca'fer'den şunu aktarır: Kur'an birdir ve bir olan Allah tarafından indirilmiştir; kıraatteki ihtilaflar ravilerden gelmektedir."},{"k":"li","x":"Şîa **mütevatir kıraatlerin de ictihâdî** olduğunu ileri sürer."},{"k":"dikkat","x":"Şiî âlimlerin baştan ön yargılı olmaları ve Ehl-i Sünnet'in sözlerini hiçbir tenkide tabi tutmadan doğrudan reddetmeleri elbette konunun çözümü anlamına gelmez."}]}],"ht":[{"s":0,"x":"Yedi harf hadisleri: Ömer–Hişâm b. Hakîm (Furkân suresi); 46 hadis, 34'ü sahih (Abdussabûr Şâhin); manevi tevatür."},{"s":1,"x":"\"Seb'a\": hakiki (yedi sayısı) veya mecaz (çokluk, kolaylık); ağır basan mecazdır."},{"s":2,"x":"Zayıf görüşlerden biri yedi harfi \"meşhur yedi imamın kıraati\" sayar; yedi kıraat ile yedi harf ayrıdır (Cerrahoğlu)."},{"s":3,"x":"Kuvvetli görüşler: yedi kabile lehçesi (Ömer ve Hişâm ikisi de Kureyşli olduğu için çelişir) · yedi vecih (İbn Kuteybe) · mânâ ile okuma (Taberî, Tahâvî; en tutarlısı)."},{"s":3,"x":"Mânâ ile okuma örnekleri: Enes (aswab), Ömer (fe'mdû), İbn Mes'ûd (zakye, ke's-sûf), Ebü'd-Derdâ (el-fâcir)."},{"s":4,"x":"Muhsin Demirci: yedi harf muayyen kelimelerde geçici bir ruhsattı; istinsahta tek harfe indirild an'ı Hz. Peygamber'e beşer beşer indirirdi\" demiştir."},{"u":6,"q":"İçkinin haram kılınmasındaki ilk aşama hangi ayettir?","a":["Nahl 67","Bakara 219","Nisâ 43","Mâide 90"],"x":"Dört aşama: Nahl 67 → Bakara 219 → Nisâ 43 → Mâide 90."},{"u":6,"q":"Hz. Âişe'nin meşhur sözüne göre Kur'an'da ilk önce ne inmiştir?","a":["Cennet ve cehennemin anlatıldığı mufassal sureler","Helal ve haram hükümleri","İçki ve zinanın yasaklanması","Namaz ve oruç hükümleri"],"x":"İnsanlar İslam'a yönelince helal ve haram inmiştir; önce \"içki içmeyin\" inseydi \"asla bırakmayız\" derlerdi."},{"u":7,"q":"Hz. Ebû Bekir döneminde cem'i gerektiren olay hangisidir?","a":["Yemâme savaşında çok sayıda kurrânın şehit olması","Ermenistan ve Azerbaycan fetihlerindeki kıraat ihtilafı","Bi'r-i Maûne'de 70 hâfızın öldürülmesi","Hz. Peygamber'in vefatı"],"x":"Hz. Ömer'in teklifinden önce çekinen Hz. Ebû Bekir sonunda işe koyuldu."},{"u":7,"q":"Bi'r-i Maûne'de öldürülen 70 hâfız neyin delilidir?","a":["Hâfızların yedi kişiyle sınırlı olmadığının","Kur'an'ın Hz. Peygamber zamanında tek mushafta toplandığının","Yedi harfin varlığının","Cem-i sânî'nin sebebinin"],"x":"Yedi kişi Kur'an'ın tamamını ezberleyip Resûlullah'a arz edenlerdir; hâfızlar bunlarla sınırlı değildir."},{"u":7,"q":"Son ayet ile Hz. Peygamber'in vefatı arasındaki süre çoğunluğa göre kaç gündür?","a":["9 gün","81 gün","40 gün","3 gün"],"x":"Bir rivayete göre 81, çoğunluğa göre 9 gündür; bu süre Kur'an'ı toplamaya yetmezdi."},{"u":7,"q":"Zeyd b. Sâbit'in \"züşşehâdeteyn\" Huzeyme'nin tek şahitliğiyle mushafa aldığı ayetler hangileridir?","a":["Tevbe suresinin son iki ayeti ve Ahzâb 23","Bakara 281 ve Nisâ 176","Fâtiha ve İhlâs","Alak'ın ilk beş ayeti"],"x":"Huzeyme'nin şahitliği iki şahit yerine geçerdi; ayrıca iki şahit şartını Hz. Ebû Bekir koymuştur."},{"u":7,"q":"Hz. Ebû Bekir döneminde toplanan Kur'an'a \"Mushaf\" isminin verilmesini kim teklif etmiştir?","a":["Abdullah b. Mes'ûd","Hz. Ömer","Zeyd b. Sâbit","Hz. Hafsa"],"x":"Bu nüsha Hz. Ebû Bekir'den Hz. Ömer'e, ondan Hz. Hafsa'ya geçmiştir."},{"u":7,"q":"Hz. Osman döneminde Iraklılar ile Şamlılar kimin kıraatini okuyordu?","a":["Iraklılar İbn Mes'ûd'un, Şamlılar Übey b. Ka'b'ın","Iraklılar Übey'in, Şamlılar İbn Mes'ûd'un","Iraklılar Zeyd'in, Şamlılar Ali'nin","Iraklılar İbn Abbas'ın, Şamlılar Muâz'ın"],"x":"Huzeyfe el-Yemânî gördüklerini Hz. Osman'a anlatmıştır."},{"u":7,"q":"Hz. Osman'ın istinsah heyetinde lehçe ihtilafında hangi lehçe esas alınmıştır?","a":["Kureyş","Hüzeyl","Temîm","Hevâzin"],"x":"Çünkü Kur'an onların diliyle inmiştir."},{"u":7,"q":"Hz. Osman'ın Medine'de bıraktığı nüshaya ne ad verilmiştir?","a":["el-Mushafü'l-İmâm","Mushaf-ı Hafsa","Mushaf-ı Şerîf","Cem-i sâlis"],"x":"Heyet 5 yılda 6 veya 7 nüsha çoğaltmıştır."},{"u":7,"q":"Kur'an'a hareke koymayı ilk başlatan kimdir?","a":["Ebü'l-Esved ed-Düelî","Halîl b. Ahmed","Nasr b. Âsım","Secâvendî"],"x":"Basra valisi Ziyâd b. Sümeyye'nin teklifiyle, «وَرَسُولُهُ» kelimesinin kesreli okunması üzerine başlamıştır. Bugünkü tarzda harekeleme Halîl b. Ahmed'indir."},{"u":7,"q":"Benzer harfleri ayırmak için yapılan noktalama (i'câm) kimin talebiyle yapılmıştır?","a":["Haccâc b. Yûsuf","Ziyâd b. Sümeyye","Hz. Osman","Muâviye"],"x":"Nasr b. Âsım'dan (bir rivayete göre Yahyâ b. Ya'mer'den) istenmiştir."},{"u":8,"q":"Ayetlerin tertibi hakkında hangisi doğrudur?","a":["İcma ile tevkîfîdir.","Sahabe içtihadıdır.","Kısmen tevkîfî, kısmen içtihadîdir.","Hz. Osman'ın tercihidir."],"x":"Zerkeşî, Ebû Ca'fer İbnü'z-Zübeyr ve Süyûtî icma olduğunu söyler."},{"u":8,"q":"Hz. Ali'nin mushafı nasıl tertip edilmişti?","a":["Nüzul sırasına göre","Uzunluğa göre","Bakara, Nisâ, Âl-i İmrân sırasıyla","Alfabetik olarak"],"x":"İkra' → Müddessir → Kalem → Müzzemmil… Bu, tertibin içtihadî olduğu görüşünün delillerindendir."},{"u":8,"q":"Surelerin tertibi hakkında tercih edilen görüş hangisidir?","a":["Ayetlerin tertibi gibi tevkîfîdir.","Tamamen içtihadîdir.","Kısmen tevkîfî, kısmen içtihadîdir.","Hz. Ebû Bekir'in tercihidir."],"x":"İbnü'l-Enbârî ve Kirmânî'nin sözleri de bunu destekler."},{"u":8,"q":"Kur'an'daki en uzun ayet hangisidir?","a":["Müdâyene ayeti","Âyetü'l-kürsî","Kelâle ayeti","Bakara 281"],"x":"En uzun sure Bakara, en uzun ayet müdâyene ayetidir."},{"u":8,"q":"Fâtiha'dan sonraki yedi uzun sureye ne ad verilir?","a":["Tıvel","Mi'ûn","Mesânî","Mufassal"],"x":"Bakara, Âl-i İmrân, Nisâ, Mâide, En'âm, A'râf ve Tevbe."},{"u":8,"q":"Resm-i Osmânî hakkında âlimlerin çoğunun görüşü hangisidir?","a":["Tevkîfî değil, Hz. Osman'ın seçtiği bir ıstılahtır; ümmet benimsediği için muhalefet caiz değildir.","Tevkîfîdir.","Istılâhîdir; ona muhalefete hiçbir engel yoktur.","Sahabe döneminde terk edilmiştir."],"x":"İmam Mâlik ve Ebû Amr ed-Dânî de bu görüştedir. Bâkıllânî ise muhalefete engel görmez."},{"u":8,"q":"Fâsıla ile ayet başı arasındaki ilişki hangisidir?","a":["Her ayet başı fâsıladır, fakat her fâsıla ayet başı değildir.","Her fâsıla ayet başıdır.","Fâsıla ile seci' aynı şeydir.","Fâsıla sadece Mekkî surelerde bulunur."],"x":"Kur'an'daki uyumlu ifadelere seci' değil fâsıla denir."},{"u":8,"q":"«وَاللَّيْلِ إِذَا يَسْرِ» ayeti hangi fâsıla çeşidine örnektir?","a":["Fâsılada harf hazfi","Fâsılada harf ziyadesi","Mütevâzî fâsıla","Belâgî sebeple kelime dizilimi"],"x":"Burada \"yâ\" harfi hazfedilmiştir; «الظُّنُونَا» ise harf ziyadesine örnektir."},{"u":9,"q":"Hz. Ömer ile Hişâm b. Hakîm hangi sureyi farklı okudukları için ihtilaf etmişti?","a":["Furkân","Fâtiha","Bakara","Kehf"],"x":"Hz. Peygamber ikisine de \"Bu sure böyle indirildi\" buyurmuştur."},{"u":9,"q":"Abdussabûr Şâhin'e göre yedi harf hadislerinin sayısı ve sahih olanları kaçtır?","a":["46 hadis, 34'ü sahih","34 hadis, 7'si sahih","70 hadis, 46'sı sahih","21 hadis, 7'si sahih"],"x":"\"Kur'an 7 harf üzere nazil olmuştur\" sözü manevi tevatür derecesindedir."},{"u":9,"q":"\"Seb'a\" lafzının delaleti konusunda ağır basan görüş hangisidir?","a":["Kesretten (çokluktan) kinayedir.","Hakiki anlamda yedi sayısıdır.","Yedi kıraat imamını gösterir.","Yedi sahabiyi gösterir."],"x":"Mecazi anlamda genişlik ve kolaylık ifade eder."},{"u":9,"q":"\"Yedi harf yedi kabilenin lehçesidir\" görüşüne yöneltilen eleştiri hangisidir?","a":["Hz. Ömer ile Hişâm ikisi de Kureyşli olduğu hâlde farklı okumuşlardır.","Bu görüş Taberî'ye aittir.","Kabilelerin sayısı yediden azdır.","Bu görüş mütevatir kıraatleri reddeder."],"x":"Ayrıca bu görüş sahipleri kabilelerin isimlerini zikretmemişlerdir."},{"u":9,"q":"Muhsin Demirci'ye göre en tutarlı görüş olan \"mânâ ile okuma\" kimlerin görüşüdür?","a":["Taberî ve Tahâvî","Ebû Ubeyd ve Beyhakî","İbn Kuteybe","Zerkeşî ve Süyûtî"],"x":"Kur'an'ın muayyen yerlerinde eş anlamlı kelimeleri birbirinin yerine kullanma kolaylığıdır."},{"u":9,"q":"Hz. Ömer'in «فَاسْعَوْا إِلَى ذِكْرِ اللَّهِ» ayetini «فَامْضُوا» diye okuması hangi görüşe örnektir?","a":["Mânâ ile okuma (el-kırâe bi'l-ma'nâ)","Yedi kabilenin lehçesi","Takdim ve te'hir","Harf ziyadesi"],"x":"Enes'in «أَصْوَبُ», İbn Mes'ûd'un «زَقْيَةً» ve «كَالصُّوفِ» okuyuşları da bu görüşe örnektir."},{"u":9,"q":"Kıraat ile yedi harf arasındaki fark nedir?","a":["Kıraat aynı kelimede med, kasr, hareke gibi değişikliklerdir; yedi harf kelimelerin yapısındaki değişikliktir.","İkisi aynı şeydir.","Yedi harf yedi imamın kıraatidir.","Kıraat kelime değişikliği, yedi harf hareke değişikliğidir."],"x":"Günümüzdeki yedi kıraat de tek harfe dahildir."},{"u":9,"q":"Şîa'nın yedi harf meselesindeki yaklaşımı hangisidir?","a":["Kur'an tek harf üzere inmiştir; kıraat ihtilafları ravilerden gelir.","Kur'an yedi harf üzere inmiş ve hepsi korunmuştur.","Yedi harf yedi imamın kıraatidir.","Yedi harf sadece Mekke döneminde vardı."],"x":"Zürâre, Ebû Ca'fer'den aktarır; Şîa mütevatir kıraatlerin de içtihadî olduğunu ileri sürer."}];
const SINAV = [{"t":"2022 · 1. dönem","q":[{"q":"Tefsir, İ'câzü'l-Kur'ân, İmam Mushaf, el-Vahyü'n-Nefsî, Resm-i Mushaf, Sarfe Teorisi, Kur'an, Sebeb-i Nüzul, Yedi Harf kavramlarının tanımını yapınız.","r":[[0,0],[1,0],[7,3],[2,6],[8,3],[5,2],[9,3]],"x":["**Tefsir:** Kur'an'daki kapalılık durumlarını giderip onun ilahî murada uygun biçimde anlaşılmasını sağlamaktır. Kâtib Çelebi: Beşerî güç ölçüsünde ve Arap dili kaidelerinin gerektirdiği ölçüde Kur'an nazmının manasını araştıran ilimdir.","**Kur'an:** Hz. Muhammed'e indirilen, mushaflarda yazılı, tevatürle nakledilen, tilaveti ile ibadet edilen ve bir suresiyle bile mucize olan Allah kelamıdır.","**İmam Mushaf (el-Mushafü'l-İmâm):** Hz. Osman döneminde çoğaltılıp Kûfe, Basra, Şam, Mekke, Bahreyn ve Yemen'e gönderilen nüshalardan Medine'de bırakılan nüshadır.","**el-Vahyü'n-Nefsî:** İnkârcıların, Hz. Peygamber'in keskin zekâ ve ferasetiyle hak ile batılı ilham yoluyla anlayıp Kur'an'ı kendi aklî istinbat ve vicdanî idrakiyle oluşturduğu iddiasıdır. Cevabı: Geçmiş ümmetlerin haberleri, yaratılışın başlangıcı, ahiret ve melekler gibi konular zekâ ve ferasetle bilinemez.","**Resm-i Mushaf (Resm-i Osmânî):** Zeyd b. Sâbit ve beraberindeki üç Kureyşlinin Hz. Osman'ın uygun gördüğü özel yazı metoduyla yazdığı mushafın imlasıdır.","**Sebeb-i Nüzul:** Hz. Peygamber'in risalet döneminde vuku bulan ve bir veya birkaç ayetin yahut bir surenin inmesine yol açan olay, durum ya da sorudur.","**Yedi Harf:** \"Kur'an yedi harf üzere indirildi; kolayınıza geleni okuyun\" hadisine dayanır. Kuvvetli görüşlere göre yedi kabilenin lehçesi, yedi vecih (tarz) veya muayyen kelimelerde eş anlamlı kelimelerle okuma ruhsatıdır (el-kırâe bi'l-ma'nâ)."],"n":"**İ'câzü'l-Kur'ân** ve **sarfe teorisi** ünitelerde ayrıca tanımlanmıyor. Kaynakta yalnızca Kur'an tarifindeki \"i'caz\" kaydı (İsrâ 88) ve tedricî nüzulün hikmetlerinden \"meydan okuma ve i'caz\" geçiyor."},{"q":"Erken dönem tefsir usulü kaynaklarından 5 tanesini müellifleriyle birlikte yazınız.","r":[[0,5]],"x":["Hâris el-Muhâsibî (ö. 243): el-Akl ve Fehmü'l-Kur'ân (alanın en eski usûl kitabı)","el-Hûfî (ö. 430): el-Burhân fî Ulûmi'l-Kur'ân (\"Ulûmü'l-Kur'ân\" tabirinin geçtiği ilk eser)","İbnü'l-Cevzî (ö. 597): Fünûnü'l-Efnân","et-Tûfî (ö. 716): el-İksîr fî Kavâidi İlmi't-Tefsîr","İbn Teymiyye (ö. 728): Mukaddime fî Usûli't-Tefsîr","Tefsir mukaddimelerinden: Taberî (ö. 310), Câmiu'l-Beyân; Râğıb el-İsfahânî (ö. 502), Mukaddimetü't-Tefsîr."],"n":""},{"q":"Kur'an kıssalarının gerçekte vuku bulmadığına dair iddiaları ve bunlara verilen cevapları yazınız.","r":[[2,6]],"x":["Kaynakta yalnızca ilgili bir cevap var: Kur'an evrenin ilk yaratılışından itibaren geçmiş toplumların haberlerini aktarır; Allah Resûlü muhtelif asırlarda olan bu olayları zekâ, istinbat ve şuurla elde edemez (vahy-i nefsî iddiasına cevap)."],"n":"Kıssalarla ilgili iddialar ve cevapları elimizdeki kaynakta işlenmiyor."},{"q":"Mübhemâtü'l-Kur'ân kavramını açıklayıp mübhemi giderme yollarını yazınız.","r":[[5,3]],"x":["Kaynakta mübhem, esbâb-ı nüzûlün faydaları arasında geçer: Esbâb-ı nüzûl mübhem ayetlerin anlaşılmasını kolaylaştırır; çünkü mübhemler akılla değil **nakille** tespit edilir.","Örnek: Abese suresindeki âmâ Abdullah b. Ümmü Mektûm'dur; «إِنَّ شَانِئَكَ» ayetindeki kişi Âs b. Vâil'dir."],"n":"Mübhemâtın tanımı ve giderme yollarının ayrıntısı elimizdeki kaynakta yok."},{"q":"Neshi kabul ve reddedenlerin gerekçelerini yazınız.","r":[[4,0],[0,5]],"x":["Kaynakta nesih ayrıca işlenmiyor. İlgili bilgiler: İlk ve son inen ayetleri bilmek nâsih-mensûhu ayırt etmeye yarar (sonraki nâsih, önceki mensuh). Şah Veliyyullah ed-Dihlevî, Süyûtî'nin mensuh olduğunu naklettiği 20 ayetten yalnızca 5'inde nesih olduğunu belirtir."],"n":"Neshi kabul ve reddedenlerin gerekçeleri elimizdeki kaynakta yok."}]},{"t":"Dönem sonu sınavı","q":[{"q":"Tefsir usulünün asli kaynaklarından 8 müstakil eseri müellifleriyle birlikte yazınız.","r":[[0,5]],"x":["Hâris el-Muhâsibî: el-Akl ve Fehmü'l-Kur'ân","el-Hûfî: el-Burhân fî Ulûmi'l-Kur'ân","İbnü'l-Cevzî: Fünûnü'l-Efnân","et-Tûfî: el-İksîr fî Kavâidi İlmi't-Tefsîr","İbn Teymiyye: Mukaddime fî Usûli't-Tefsîr","ez-Zerkeşî: el-Burhân fî Ulûmi'l-Kur'ân","el-Kâfiyecî: et-Teysîr fî Kavâidi İlmi't-Tefsîr","es-Süyûtî: el-İtkân fî Ulûmi'l-Kur'ân","(Dokuzuncusu: Şah Veliyyullah ed-Dihlevî, el-Fevzü'l-Kebîr fî Usûli't-Tefsîr)"],"n":""},{"q":"Aşağıdaki ıstılahları tarif ediniz: Kur'an, Ulûmü'l-Kur'ân, Tefsir, Te'vil, Sarfe Nazariyesi, Sebeb-i Nüzul, Garîbü'l-Kur'ân, Müşkilü'l-Kur'ân, Mübhemâtü'l-Kur'ân ve el-Vücûh ve'n-Nezâir.","r":[[1,0],[0,0],[5,2]],"x":["**Kur'an:** Hz. Muhammed'e indirilen, mushaflarda yazılı, tevatürle nakledilen, tilavetiyle ibadet edilen ve bir suresiyle bile mucize olan Allah kelamıdır.","**Tefsir:** Kur'an'daki kapalılık durumlarını giderip onun ilahî murada uygun biçimde anlaşılmasını sağlamaktır.","**Sebeb-i Nüzul:** Hz. Peygamber'in risalet döneminde vuku bulan ve bir veya birkaç ayetin yahut bir surenin inmesine yol açan olay, durum ya da sorudur.","**Mübhemâtü'l-Kur'ân:** Kaynakta yalnızca mübhemlerin akılla değil nakille tespit edildiği belirtilir (Abese: Abdullah b. Ümmü Mektûm; «إِنَّ شَانِئَكَ»: Âs b. Vâil)."],"n":"Ulûmü'l-Kur'ân, te'vil, sarfe nazariyesi, garîbü'l-Kur'ân, müşkilü'l-Kur'ân ve el-vücûh ve'n-nezâir ünitelerde ayrıca tanımlanmıyor. Kaynakta \"Ulûmü'l-Kur'ân\" tabirinin ilk geçtiği eserin Hûfî'nin el-Burhân'ı olduğu bilgisi var."},{"q":"Kur'an'ın cem'i ifadesi ile ne kastedilmektedir? Kısaca açıklayınız.","r":[[7,0],[7,1],[7,2],[7,3]],"x":["Cem' iki manada kullanılır: **hıfz** (ezberleme) ve **kitâbet** (ayet ve surelerin yazılması).","**Cem-i evvel:** Resûlullah zamanında hıfz ve kitâbet; vahiy kâtipleri ayetleri Resûlullah'ın gösterdiği yerlere yazıyordu, ama Kur'an tek mushafta toplanmamıştı.","**Cem-i sânî:** Hz. Ebû Bekir zamanında, Yemâme'de kurrânın şehit olması üzerine Hz. Ömer'in teklifiyle Zeyd b. Sâbit'in dağınık yazıları yedi harfi içeren tek mushafta toplaması.","**Cem-i sâlis:** Hz. Osman zamanında kıraat ihtilafı üzerine mushafın bir harf ve Kureyş lehçesi üzerinde çoğaltılıp (istinsah) bölgelere gönderilmesi."],"n":""},{"q":"Kur'an'daki ayetlerin Mekkî veya Medenî oluşu neye göre belirlenmiştir? Görüşleri kısaca yazınız.","r":[[3,3],[3,2]],"x":["**1. Zaman:** Hicretten önce inen Mekkî, sonra inen Medenîdir; nerede indiğinin önemi yoktur (Veda Haccında inen Mâide 3 Medenîdir). En uygun görüş budur; kapsayıcı ve tutarlıdır.","**2. Mekân:** Hicretten sonra inse bile Mekke ve çevresinde inen Mekkî, Medine ve çevresinde inen Medenîdir.","**3. Muhatap:** Mekke halkına hitap eden («يَا أَيُّهَا النَّاسُ») Mekkî, Medine halkına hitap eden («يَا أَيُّهَا الَّذِينَ آمَنُوا») Medenîdir. Bu ölçü tutarlı değildir: Bakara ve Nisâ Medenî olduğu hâlde \"Ey insanlar\" hitabı içerir.","Bilinme yolu: rivayet (sahabe ve tâbiînden; Kur'an'ın çoğu bu yolla) ve kıyas (Mekkî ve Medenînin özelliklerine dayalı içtihad)."],"n":""},{"q":"Aynı ayetle ilgili olarak sebeb-i nüzul rivayetleri birden fazla olduğunda kabul açısından nasıl bir yol takip edileceğini açıklayınız.","r":[[5,6],[5,5]],"x":["1. Sigalar sarih değilse («نَزَلَتْ هَذِهِ الْآيَةُ فِي كَذَا») maksat tefsirdir; çelişki yoktur.","2. Biri sarih diğeri değilse sarih olana itimat edilir (Bakara 223: Câbir'in sarih rivayeti, İbn Ömer'inki tefsir).","3. İkisi de sarihse isnadı sahih olan tercih edilir (Duhâ suresi: Sahîhayn'daki rivayet).","4. İsnadda da eşitse ercah olan tercih edilir: ravinin olayda hazır olması veya rivayetin daha sahih olması (İsrâ 85: Buhârî'deki İbn Mes'ûd rivayeti).","5. Tercihte de eşitse aralarında cem' yapılır (lian ayetleri: Hilâl b. Ümeyye ve Uveymir).","6. Zaman uzaklığından cem' de mümkün değilse nüzulün tekerrürüne hamledilir (Nahl 126: Uhud ve Mekke fethi). Süyûtî, Zerkeşî ve İbn Teymiyye tekerrürü kabul eder."],"n":""},{"q":"Hûd suresinin 1. ayetinde Kur'an'ın tamamının muhkem, Zümer suresinin 23. ayetinde tamamının müteşâbih olduğu ifade edilmektedir. Âl-i İmrân suresinin 7. ayetinde ise bazı ayetlerin muhkem, bazılarının müteşâbih olduğu vurgulanmaktadır. Çelişki gibi görünen bu durumu izah ediniz.","r":[],"x":["Muhkem ve müteşâbih elimizdeki kaynakta ayrı bir konu olarak işlenmiyor."],"n":"Kaynakta muhkem-müteşâbih yalnızca usûl eserlerinde işlenen konular arasında anılıyor (Muhâsibî, Kâfiyecî, Râğıb, Dihlevî)."},{"q":"İçtimâî tefsir ekolünün temel özelliklerini kısaca açıklayınız.","r":[],"x":["Tefsir ekolleri elimizdeki kaynakta işlenmiyor."],"n":"Bu soru kaynağın kapsamı dışında."},{"q":"«لَيْسَ عَلَيْكُمْ جُنَاحٌ أَنْ تَبْتَغُوا فَضْلًا مِنْ رَبِّكُمْ فِي مَوَاسِمِ الْحَجِّ فَإِذَا أَفَضْتُمْ مِنْ عَرَفَاتٍ فَاذْكُرُوا اللَّهَ عِنْدَ الْمَشْعَرِ الْحَرَامِ» Kıraatler belli özellikleri dikkate alınarak mütevatir, âhâd vb. tasnife tabi tutulmuştur. Bu özellikler dikkate alındığında yukarıdaki örnek hangi kıraat çeşidi içinde değerlendirilmelidir?","r":[[7,3],[1,0]],"x":["Kaynakta bu ifade, **İbn Abbas'ın şahsi nüshasındaki** Bakara 198'in şekli olarak geçer: «فِي مَوَاسِمِ الْحَجِّ» eki tefsir ve açıklama maksadıyla yazılmış özel bir nottur. Hz. Osman'ın istinsahında bu tür notlar mushaflara yazılmamıştır.","Kur'an tarifindeki \"tevatür\" kaydı şaz kıraatleri dışarıda bırakır; bu ek mütevatir değildir ve mushafta yer almaz."],"n":"Kıraatlerin mütevatir, âhâd, şaz, müdrec gibi tasnifi elimizdeki kaynakta ayrıca işlenmiyor."}]}];

<script>
/* ---------- yardımcılar ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[’'ʿʾ‘`"]/g, '').replace(/ı/g, 'i').replace(/[^a-z0-9؀-ۿ ]/g, ' ').replace(/\s+/g, ' ').trim();
const strip = h => String(h).replace(/<[^>]+>/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/\s+/g, ' ').trim();
const plain = s => String(s).replace(/\*\*/g, '').replace(/[«»]/g, '');
// Metin biçimi: **kalın**, «Arapça»
function fmt(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/«([^»]+)»/g, (m, a) => /[؀-ۿ]/.test(a) ? `<span class="ar" dir="rtl" lang="ar">${a}</span>` : `«${a}»`);
}

/* ---------- kalıcı durum (tarayıcıda, ön ek: tu_) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('tu_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('tu_' + k, JSON.stringify(v)); } catch (e) {} }
};
let stats = store.get('stats', {});   // anahtar -> {ok, bad}
let boxes = store.get('boxes', {});   // tanım id -> kutu 1..5
let oral  = store.get('oral', {});    // bölüm anahtarı -> 1/0
let uStat = store.get('units', {});   // ünite -> en iyi mini test (0-5)
function record(key, ok) { const s = stats[key] || {ok: 0, bad: 0}; ok ? s.ok++ : s.bad++; stats[key] = s; store.set('stats', stats); ozet(true); }
/* ---------- Giray Akademi özeti (alt çubuk · Karnem) ---------- */
const YAD = {home: 'Ana sayfa', study: 'Üniteler', quiz: 'Test', match: 'Eşleştirme', flash: 'Kavram kartları', oralView: 'Konu tekrarı', review: 'Hızlı tekrar', exam: 'Geçmiş sınav soruları', browse: 'Sözlük', progress: 'İlerlemem'};
function yer() {
  const v = curView, a = curArg;
  if (v === 'unitView') return {ad: (a + 1) + '. ünite', url: '/tefsir_usulu/#unitView-' + a};
  if (v === 'quiz' && a && a.unit !== undefined && a.unit !== null) return {ad: (a.unit + 1) + '. ünite testi', url: '/tefsir_usulu/#unitView-' + a.unit};
  if (v === 'quiz' || v === 'home') return {ad: YAD[v], url: '/tefsir_usulu/'};
  return {ad: YAD[v] || 'Ana sayfa', url: '/tefsir_usulu/#' + v};
}
function ozet(aktif) {
  if (typeof gaOzet !== 'function') return;
  const tot = Object.values(stats).reduce((a, s) => ({ok: a.ok + s.ok, bad: a.bad + s.bad}), {ok: 0, bad: 0});
  const n = UNITELER.filter((u, i) => (uStat[i] || 0) >= GECME).length;
  gaOzet({bitti: n / UNITELER.length, etiket: n + '/' + UNITELER.length + ' ünite', d: tot.ok, y: tot.bad, kart: Object.values(boxes).filter(b => b >= 4).length, yer: yer(), aktif: !!aktif});
}
function alt(b) { if (typeof gaAltGizle === 'function') gaAltGizle(b); }

/* ---------- veri hazırlığı ---------- */
const TANIM = [], BOLUM = [];
UNITELER.forEach((u, ui) => u.s.forEach((s, si) => {
  BOLUM.push({u: ui, s: si, h: s.h});
  s.b.forEach(b => {
    if (b.k === 'd') TANIM.push({id: TANIM.length, u: ui, s: si, t: b.t, x: b.x});
    // İki sütunlu "… | Tanım/Anlamı" tabloları da kavram kartı olur
    if (b.k === 'tbl' && b.r[0].length === 2 && /^(Tanım|Anlamı)$/.test(b.r[0][1])) b.r.slice(1).forEach(r => TANIM.push({id: TANIM.length, u: ui, s: si, t: r[0].replace(/\*\*/g, '').replace(/^\d+\.\s*/, ''), x: r[1]}));
  });
}));
const ESER = ESER_T;
// Aynı adla birden çok müellife bağlanan eserler (el-Burhân, Mebâhis, Tefsir Usûlü…) ve bir müellifin birden çok eseri tek sorudan fazla üretilmez
const eserSay = {}; ESER.forEach(r => { const k = norm(r.e); (eserSay[k] ||= new Set()).add(norm(r.m)); });
const ESER_Q = ESER.filter(r => eserSay[norm(r.e)].size === 1 && !/[,;]/.test(r.e)).filter((r, i, a) => a.findIndex(x => norm(x.e) === norm(r.e)) === i);
ESER_Q.forEach((r, i) => r.id = i);
const GECME = 4;

/* ---------- soru üretici ---------- */
// Havuz öğesi: {key, u, make()}
const maskTerm = (x, t) => {
  let out = x;
  t.replace(/\(.*?\)/g, '').split(/[\s\-–]+/).filter(w => w.length > 3 && !/^(kur'an|kuran|ayet|âyet)$/i.test(w)).forEach(w => {
    out = out.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '…');
  });
  return out;
};
function pickDistinct(cands, n, keyFn, exclude) {
  const seen = new Set(exclude.map(keyFn)), out = [];
  for (const c of cands) { const k = keyFn(c); if (!seen.has(k)) { seen.add(k); out.push(c); if (out.length === n) break; } }
  return out;
}
const nearFirst = (list, u) => [...shuffle(list.filter(x => x.u === u)), ...shuffle(list.filter(x => Math.abs(x.u - u) <= 2 && x.u !== u)), ...shuffle(list.filter(x => Math.abs(x.u - u) > 2))];
function qTanim(d) {
  const tersi = Math.random() < 0.65;
  const fk = x => norm(x.t);
  if (tersi) {   // tanımı göster, kavramı sor
    const metin = maskTerm(d.x, d.t);
    const cands = nearFirst(TANIM.filter(x => x.id !== d.id && !norm(d.x).includes(norm(x.t))), d.u);
    const dis = pickDistinct(cands, 3, fk, [d]);
    return {key: 'd:' + d.id, u: d.u, s: d.s, long: true, soru: `<small>Aşağıdaki tanım hangi kavrama aittir?</small>${fmt(metin)}`, dogru: d.t, sec: shuffle([d.t, ...dis.map(x => x.t)]), aciklama: `<b>${fmt(d.t)}:</b> ${fmt(d.x)}`};
  }
  const cands = nearFirst(TANIM.filter(x => x.id !== d.id && norm(x.x) !== norm(d.x)), d.u);
  const dis = pickDistinct(cands, 3, x => norm(x.x).slice(0, 60), [d]);
  const kisalt = x => plain(maskTerm(x.x, x.t));
  return {key: 'd:' + d.id, u: d.u, s: d.s, soru: `<small>Hangisi bu kavramın tanımıdır?</small><em>${fmt(d.t)}</em>`, dogru: kisalt(d), sec: shuffle([kisalt(d), ...dis.map(kisalt)]), aciklama: `<b>${fmt(d.t)}:</b> ${fmt(d.x)}`};
}
function qEser(r) {
  const cands = nearFirst(ESER.filter(x => norm(x.m) !== norm(r.m)), r.u);
  const dis = pickDistinct(cands, 3, x => norm(x.m), [r]);
  return {key: 'e:' + r.id, u: r.u, s: r.s, soru: `<em>${fmt(r.e)}</em> kimin eseridir?`, dogru: r.m, sec: shuffle([r.m, ...dis.map(x => x.m)]), aciklama: `<b>${fmt(r.e)}</b> → ${fmt(r.m)}${r.not ? ` (ö. ${fmt(r.not)})` : ''}`};
}
function qEl(i) {
  const q = SORULAR[i];
  return {key: 'q:' + i, u: q.u, soru: fmt(q.q), dogru: q.a[0], sec: shuffle(q.a), aciklama: fmt(q.x)};
}
const HAVUZ = [
  ...SORULAR.map((q, i) => ({key: 'q:' + i, u: q.u, make: () => qEl(i)})),
  ...TANIM.map(d => ({key: 'd:' + d.id, u: d.u, make: () => qTanim(d)})),
  ...ESER_Q.map(r => ({key: 'e:' + r.id, u: r.u, make: () => qEser(r)}))
];
function weightedPick(list, n) {
  const w = list.map(x => { const s = stats[x.key]; return s ? 1 + s.bad * 2 - s.ok * .5 : 1.5; });
  const out = [], used = new Set();
  while (out.length < Math.min(n, list.length)) {
    let tot = 0; list.forEach((x, i) => { if (!used.has(i)) tot += Math.max(w[i], .2); });
    let rnd = Math.random() * tot;
    for (let i = 0; i < list.length; i++) { if (used.has(i)) continue; rnd -= Math.max(w[i], .2); if (rnd <= 0) { used.add(i); out.push(list[i]); break; } }
  }
  return out;
}

  const list = [], mu = new Set();
  for (const r of shuffle(ESER_Q)) { const k = norm(r.m); if (!mu.has(k)) { mu.add(k); list.push(r); } if (list.length === 5) break; }
  M = {list, left: shuffle(list), right: shuffle(list), sel: null, done: new Set(), hata: 0, t0: Date.now()};
  renderM();
}
function renderM() {
  $('#app').innerHTML = `
  <div class="bar"><div class="progress"><i style="width:${100 * M.done.size / M.list.length}%"></i></div><span class="count">${M.done.size} / ${M.list.length} · ${M.hata} hata</span></div>
  <p class="lead" style="margin-bottom:12px">Soldan bir eser seç, sonra sağdan müellifine dokun.</p>
  <div class="match">
    <div class="col"><h4>Eser</h4>${M.left.map(r => `<button class="tile ${M.done.has(r.id) ? 'done' : M.sel === r.id ? 'sel' : ''}" ${M.done.has(r.id) ? 'disabled' : ''} onclick="mSel(${r.id})">${fmt(r.e)}</button>`).join('')}</div>
    <div class="col"><h4>Müellif</h4>${M.right.map(r => `<button class="tile ${M.done.has(r.id) ? 'done' : ''}" id="mr-${r.id}" ${M.done.has(r.id) ? 'disabled' : ''} onclick="mPick(${r.id})">${fmt(r.m)}</button>`).join('')}</div>
  </div>`;
}
function mSel(id) { M.sel = id; renderM(); }
function mPick(id) {
  if (M.sel === null) return;
  if (M.sel === id) { M.done.add(id); record('e:' + id, true); M.sel = null; renderM(); if (M.done.size === M.list.length) mEnd(); }
  else { M.hata++; record('e:' + M.sel, false); const el = $('#mr-' + id); el.classList.add('wrong'); setTimeout(() => { el.classList.remove('wrong'); $('#app .bar .count').textContent = `${M.done.size} / ${M.list.length} · ${M.hata} hata`; }, 320); }
}
function mEnd() {
  const sn = Math.round((Date.now() - M.t0) / 1000);
  $('#app').innerHTML = `<div class="card result" style="margin-top:24px"><div class="big">✓</div><p class="lead">${sn} saniyede, ${M.hata} hatayla bitirdin.</p>
  <div class="list" style="text-align:left;margin-top:18px">${M.list.map(r => `<div class="row"><div class="e">${fmt(r.e)}</div><div class="n">${fmt(r.m)} · <span style="color:var(--muted)">Ünite ${r.u + 1}</span></div></div>`).join('')}</div>
  <div class="actions" style="justify-content:center"><button class="btn" onclick="match()">Yeni tur</button></div></div>`;
}

/* ---------- kavram kartları (Leitner) ---------- */
let F = null;
function flash(u) {
  const fu = (u === undefined || u === null) ? store.get('flashU', -1) : u;
  store.set('flashU', fu);
  const list = fu >= 0 ? TANIM.filter(d => d.u === fu) : TANIM;
  const sirali = shuffle(list).sort((a, b) => (boxes[a.id] || 0) - (boxes[b.id] || 0)).slice(0, 20);
  F = {list: shuffle(sirali), i: 0, bildim: 0, u: fu};
  renderF();
}
function unitSelect(cur, fn) {
  return `<select class="select" onchange="${fn}(+this.value)"><option value="-1">Bütün üniteler</option>${UNITELER.map((u, i) => `<option value="${i}" ${cur === i ? 'selected' : ''}>${i + 1}. ${esc(u.t)}</option>`).join('')}</select>`;
}
function renderF() {
  const d = F.list[F.i], kutu = boxes[d.id] || 0;
  $('#app').innerHTML = `
  <div class="rowctl">${unitSelect(F.u, 'flash')}</div>
  <div class="bar"><div class="progress"><i style="width:${100 * F.i / F.list.length}%"></i></div><span class="count">${F.i + 1} / ${F.list.length}</span></div>
  <div class="flash" onclick="this.classList.toggle('flip')"><div class="flash-in">
    <div class="face"><span class="tag">Ünite ${d.u + 1}</span><div class="t">${fmt(d.t)}</div><div class="s" style="color:var(--muted)">Tanımı nedir?</div><div class="hint">Çevirmek için dokun · kutu ${kutu}/5</div></div>
    <div class="face back"><div class="t" style="font-size:1.15rem">${fmt(d.t)}</div><div class="s">${fmt(d.x)}</div></div>
  </div></div>
  <div class="actions" style="justify-content:center">
    <button class="btn red" onclick="fAns(false)">Bilemedim</button>
    <button class="btn" onclick="fAns(true)">Bildim</button>
  </div>
  <div style="text-align:center;margin-top:10px">${bldButton('d:' + d.id, 'Kavram kartı · Ünite ' + (d.u + 1) + ' · ' + UNITELER[d.u].s[d.s].h, plain(d.t) + ': ' + plain(d.x))}</div>`;
}
function fAns(ok) {
  const d = F.list[F.i];
  boxes[d.id] = ok ? Math.min((boxes[d.id] || 0) + 1, 5) : 1; store.set('boxes', boxes); ozet(true);
  record('d:' + d.id, ok); if (ok) F.bildim++;
  F.i++;
  if (F.i < F.list.length) renderF();
  else $('#app').innerHTML = `<div class="card result" style="margin-top:24px"><div class="big">${F.bildim}/${F.list.length}</div><p class="lead">Deste bitti. Bilemediklerin bir sonraki destede önce gelecek.</p><div class="actions" style="justify-content:center"><button class="btn" onclick="flash()">Yeni deste</button></div></div>`;
}

/* ---------- konu tekrarı ---------- */
let O = null;
const bKey = b => b.u + '-' + b.s;
function oralView(u) {
  const fu = (u === undefined || u === null) ? store.get('oralU', -1) : u;
  store.set('oralU', fu);
  const list = BOLUM.filter(b => (fu < 0 || b.u === fu) && UNITELER[b.u].s[b.s].b.length >= 2);
  const sirali = shuffle(list).sort((a, b) => (oral[bKey(a)] ?? -1) - (oral[bKey(b)] ?? -1));
  O = {list: sirali.slice(0, 10), i: 0, u: fu};
  renderO();
}
function renderO() {
  const b = O.list[O.i], d = oral[bKey(b)], s = UNITELER[b.u].s[b.s];
  $('#app').innerHTML = `
  <div class="rowctl">${unitSelect(O.u, 'oralView')}</div>
  <div class="bar"><div class="progress"><i style="width:${100 * O.i / O.list.length}%"></i></div><span class="count">${O.i + 1} / ${O.list.length}</span></div>
  <div class="card">
    <div class="cardhead"><span class="tag">Ünite ${b.u + 1} · ${esc(UNITELER[b.u].t)}${d === 1 ? ' · daha önce bildin' : d === 0 ? ' · daha önce bilemedin' : ''}</span>${bldButton('b:' + b.u + '-' + b.s, 'Konu tekrarı · Ünite ' + (b.u + 1) + ' · ' + UNITELER[b.u].t, s.h)}</div>
    <div class="q">${fmt(s.h)}</div>
    <p class="lead" id="think" style="font-size:.9rem">Bu bölümde neler olduğunu önce kendin anlat (tanım, maddeler, eserler), sonra içeriği aç.</p>
    <div class="answer lesson" id="ans">${s.b.map(blockHTML).join('')}</div>
    <div class="actions" id="oa"><button class="btn" onclick="showAns()">İçeriği göster</button></div>
  </div>`;
}
function showAns() {
  $('#ans').classList.add('show'); $('#think').classList.add('hide');
  $('#oa').innerHTML = `<button class="btn red" onclick="oAns(0)">Bilemedim</button><button class="btn" onclick="oAns(1)">Bildim</button>`;
}
function oAns(v) {
  oral[bKey(O.list[O.i])] = v; store.set('oral', oral); O.i++;
  if (O.i < O.list.length) renderO();
  else $('#app').innerHTML = `<div class="card result" style="margin-top:24px"><div class="big">✓</div><p class="lead">Bu turdaki ${O.list.length} bölümü bitirdin.</p><div class="actions" style="justify-content:center"><button class="btn" onclick="oralView()">Yeni tur</button></div></div>`;
}

/* ---------- hızlı tekrar ---------- */
function review(u) {
  const fu = (u === undefined || u === null) ? store.get('reviewU', -1) : u;
  store.set('reviewU', fu);
  const list = UNITELER.map((x, i) => i).filter(i => fu < 0 || i === fu);
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">Hızlı tekrar</h2>
  <p class="lead">Her ünitenin en önemli maddeleri. Bir maddenin yanındaki › ile o bölüme gidebilirsin.</p>
  <div class="rowctl">${unitSelect(fu, 'review')}</div>
  ${list.map(i => `<div class="htu"><div class="htt"><span class="no">${i + 1}</span>${esc(UNITELER[i].t)}</div>${htHTML(i, true)}</div>`).join('')}`;
}

/* ---------- geçmiş sınav soruları ---------- */
function exam() {
  let k = 0;
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">Geçmiş sınav soruları</h2>
  <p class="lead">Önce kendin cevapla, sonra <b>Cevabı göster</b>'e dokun. Cevaplar ünitelerdeki bilgilere dayanır; altındaki bağlantılar ilgili bölümü açar.</p>
  ${SINAV.map((g, gi) => `<div class="section-title">${esc(g.t)}</div>${g.q.map((q, qi) => { k++; const id = 'x' + gi + '-' + qi; return `<div class="exq"><div class="qq"><span class="no">${qi + 1}</span><span>${fmt(q.q)}</span>${bldButton('x:' + (gi + 1) + '-' + (qi + 1), 'Geçmiş sınav soruları · ' + g.t, plain(q.q))}</div>
    <div class="actions" style="justify-content:flex-start;margin-top:10px" id="${id}b"><button class="btn sec" onclick="exShow('${id}')">Cevabı göster</button></div>
    <div class="exa hide" id="${id}"><div class="exl">Cevap</div>${q.x.map(x => `<p>${fmt(x)}</p>`).join('')}${q.n ? `<div class="box bk" style="margin-top:8px"><b class="lb">Not</b>${fmt(q.n)}</div>` : ''}
    ${q.r.length ? `<div class="links">${q.r.map(([u, s]) => `<button onclick="toSection(${u},${s})">Ü${u + 1} · ${esc(UNITELER[u].s[s].h)}</button>`).join('')}</div>` : ''}</div></div>`; }).join('')}`).join('')}`;
}
function exShow(id) { $('#' + id).classList.remove('hide'); $('#' + id + 'b').classList.add('hide'); }
function toSection(u, s) { pendingFocus = {id: `ls-${u}-${s}`}; go('unitView', u); }

/* ---------- sözlük ---------- */
let bTab = 'kavram';
function browse() {
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">Kavram ve eser sözlüğü</h2>
  <div class="rowctl" style="margin:12px 0 10px">
    <button class="btn ${bTab === 'kavram' ? '' : 'sec'}" onclick="bTab='kavram';browse()">Kavramlar (${TANIM.length})</button>
    <button class="btn ${bTab === 'eser' ? '' : 'sec'}" onclick="bTab='eser';browse()">Eserler (${ESER.length})</button>
  </div>
  <input class="search" id="bq" type="search" placeholder="${bTab === 'kavram' ? 'Kavram ya da tanımda ara…' : 'Eser ya da müellif ara…'}" oninput="doBrowse()">
  <div class="list" id="bl"></div>`;
  doBrowse();
}
function doBrowse() {
  const t = norm($('#bq').value || '');
  const src = bTab === 'kavram' ? TANIM : ESER;
  const hits = src.filter(r => !t || norm(bTab === 'kavram' ? r.t + ' ' + r.x : r.e + ' ' + r.m).includes(t));
  $('#bl').innerHTML = hits.length ? hits.map(r => bTab === 'kavram'
    ? `<button class="row" onclick="toSection(${r.u},${r.s})"><div class="e">${fmt(r.t)}</div><div class="n">${fmt(r.x)}</div><div class="w">Ünite ${r.u + 1} · ${esc(UNITELER[r.u].s[r.s].h)}</div></button>`
    : `<button class="row" onclick="toSection(${r.u},${r.s})"><div class="e">${fmt(r.e)}</div><div class="n">${fmt(r.m)}${r.not ? ` <span style="color:var(--muted)">(${fmt(r.not)})</span>` : ''}</div><div class="w">Ünite ${r.u + 1} · ${esc(UNITELER[r.u].s[r.s].h)}</div></button>`).join('')
    : '<p class="empty">Sonuç yok.</p>';
}

/* ---------- ilerleme ---------- */
function progress() {
  const satir = UNITELER.map((u, i) => {
    let ok = 0, bad = 0; unitItems(i).forEach(x => { const s = stats[x.key]; if (s) { ok += s.ok; bad += s.bad; } });
    const p = ok + bad ? Math.round(100 * ok / (ok + bad)) : null;
    return `<div class="meter"><span title="${esc(u.t)}">${i + 1}. ${esc(u.t)}</span><div class="progress"><i style="width:${p ?? 0}%;background:${p === null ? 'transparent' : p >= 70 ? 'var(--green-2)' : p >= 45 ? 'var(--gold)' : 'var(--red)'}"></i></div><span class="count">${p === null ? '—' : '%' + p}</span></div>`;
  }).join('');
  const byKey = {}; HAVUZ.forEach(x => byKey[x.key] = x);
  const zayif = Object.entries(stats).filter(([k, s]) => s.bad > 0 && byKey[k]).sort((a, b) => (b[1].bad - b[1].ok * .5) - (a[1].bad - a[1].ok * .5)).slice(0, 12).map(([k]) => k);
  const etiket = k => { const [t, id] = k.split(':');
    if (t === 'd') return `<b>${fmt(TANIM[id].t)}</b>: ${fmt(TANIM[id].x)}`;
    if (t === 'e') return `<b>${fmt(ESER_Q[id].e)}</b> → ${fmt(ESER_Q[id].m)}`;
    return `${fmt(SORULAR[id].q)} <b>${fmt(SORULAR[id].a[0])}</b>`; };
  const oralN = Object.keys(oral).length, oralOk = Object.values(oral).filter(v => v === 1).length;
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">İlerlemem</h2>
  <div class="card" style="margin-top:14px">${satir}
    <p class="lead" style="font-size:.88rem;margin-top:12px">Çalış bölümü: ${uDone()} / ${UNITELER.length} ünite tamamlandı.<br>Konu tekrarı: ${oralN} bölüm çalışıldı, ${oralOk} tanesini bildin.</p></div>
  <div class="section-title">En çok karıştırdıkların</div>
  ${zayif.length ? `<div class="list">${zayif.map(k => `<div class="row"><div class="n">${etiket(k)}</div></div>`).join('')}</div>
    <div class="actions"><button class="btn" onclick='quiz({keys:${JSON.stringify(zayif)}})'>Bunlarla test çöz</button></div>` : '<p class="empty">Henüz yanlış yok. Biraz test çözünce burada görünecek.</p>'}
  <div class="actions" style="margin-top:30px"><button class="btn sec" onclick="sifirla()">İlerlemeyi sıfırla</button></div>`;
}
function sifirla() {
  if (!confirm('Bütün ilerleme kaydın silinsin mi?')) return;
  stats = {}; boxes = {}; oral = {}; uStat = {};
  store.set('stats', stats); store.set('boxes', boxes); store.set('oral', oral); store.set('units', uStat); progress();
}

/* ---------- genel arama ---------- */
let SIDX = null;
function bTxt(b) {
  if (b.k === 'tbl') return b.r.map(r => r.filter(Boolean).map(plain).join(' – ')).join(' · ');
  if (b.k === 'steps') return b.x.map(plain).join(' · ');
  if (b.k === 'ar') return plain(b.x || '');
  if (b.k === 'sc') return plain(b.q + ' ' + b.x);
  return plain((b.t ? b.t + ': ' : '') + b.x);
}
function buildIndex() {
  SIDX = [];
  UNITELER.forEach((u, ui) => u.s.forEach((s, si) => {
    SIDX.push({u: ui, s: si, kind: 'b', t: s.h, x: s.b.map(bTxt).join(' · ')});
  }));
}
function openSearch() {
  if (!SIDX) buildIndex();
  $('#sov').classList.add('open');
  try { history.pushState(Object.assign({}, history.state, {search: true}), ''); } catch (e) {}
  $('#sq').value = ''; doGlobalSearch(); setTimeout(() => $('#sq').focus(), 30);
}
function closeSearch(viaPop) {
  $('#sov').classList.remove('open');
  if (!viaPop && history.state && history.state.search) { try { history.back(); } catch (e) {} }
}
function markText(text, t) {
  const n = norm(text); const i = n.indexOf(t);
  if (!t || i < 0) return esc(text.slice(0, 160)) + (text.length > 160 ? '…' : '');
  // norm uzunluğu yaklaşık korunduğundan konuma yakın bir pencere al
  const a = Math.max(0, i - 60), b = Math.min(text.length, i + t.length + 100);
  return (a ? '…' : '') + esc(text.slice(a, b)) + (b < text.length ? '…' : '');
}
function doGlobalSearch() {
  const t = norm($('#sq').value || '');
  if (t.length < 2) { $('#sres').innerHTML = '<p class="empty">En az iki harf yaz.</p>'; return; }
  const kav = TANIM.filter(d => norm(d.t).includes(t)).slice(0, 12);
  const bol = SIDX.filter(r => norm(r.t + ' ' + r.x).includes(t)).slice(0, 30);
  $('#sres').innerHTML = (kav.length ? `<div class="sgrp">Kavramlar</div>${kav.map(d => `<button class="sitem" onclick="hit(${d.u},${d.s})"><div class="w">Ünite ${d.u + 1}</div><div class="t">${fmt(d.t)}</div><div class="x">${esc(plain(d.x).slice(0, 140))}</div></button>`).join('')}` : '')
    + (bol.length ? `<div class="sgrp">Konu anlatımları</div>${bol.map(r => `<button class="sitem" onclick="hit(${r.u},${r.s})"><div class="w">Ünite ${r.u + 1} · ${esc(UNITELER[r.u].t)}</div><div class="t">${esc(r.t)}</div><div class="x">${markText(r.x, t)}</div></button>`).join('')}` : '')
    || '<p class="empty">Sonuç yok.</p>';
}
function hit(u, s) { $('#sov').classList.remove('open'); pendingFocus = {id: `ls-${u}-${s}`}; if (history.state && history.state.search) { try { history.replaceState({view: curView, arg: curArg, d: (history.state.d || 0)}, ''); } catch (e) {} } go('unitView', u); }
function focusHit(f) { jump(f.id); }

/* ---------- başlat ---------- */
const ilkHash = (location.hash || '').slice(1);
try { history.replaceState({view: 'home', arg: null, d: 0}, '', location.pathname + location.search); } catch (e) {}
render('home');
// Alt çubuktaki "Devam et" / "Dersler" bağlantısıyla gelindiyse kaldığı yere aç (ör. #unitView-7)
(function () {
  const h = ilkHash; if (!h) return;
  const m = h.match(/^(\w+?)(?:-(\d+))?$/); if (!m) return;
  const v = m[1], a = m[2] === undefined ? undefined : +m[2];
  if (!['study', 'unitView', 'match', 'flash', 'oralView', 'review', 'exam', 'browse', 'progress'].includes(v)) return;
  if (v === 'unitView' && !(a >= 0 && a < UNITELER.length)) return;
  if (v === 'unitView') { go('study'); go('unitView', a); } else go(v);
})();
</script>
</body>
